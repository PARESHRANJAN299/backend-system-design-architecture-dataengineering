<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
<title id="t">Silver: quality checks and applying changes</title><desc id="d">Bronze keeps an original record and a later correction. Quality checks run on the records; invalid ones go to quarantine. Valid changes are applied in order with insert, update and delete logic, so Silver ends with the corrected amount of 900, not an appended total of 1,900.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="660" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="632" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Silver: quality checks and applying changes</text>
<text x="30" y="84" class="s">apply Walmart's change instructions, do not just append</text>
<rect x="30" y="120" width="290" height="180" rx="12" class="pill"/><text x="46" y="144" class="pt">Bronze Delta</text><text x="46" y="160" class="sub" style="font-size:10px">what we received, both kept</text>
<rect x="46" y="176" width="258" height="48" rx="8" fill="none" stroke="#30363d"/><text x="58" y="196" class="dim">5 Oct   amount 1,000   flag I</text><text x="58" y="212" class="sub" style="font-size:10px">first delivery, same business key</text>
<rect x="46" y="234" width="258" height="48" rx="8" fill="none" stroke="#30363d"/><text x="58" y="254" class="dim">5 Oct   amount 900   flag U</text><text x="58" y="270" class="sub" style="font-size:10px">later correction, same business key</text>
<rect x="30" y="320" width="290" height="110" rx="12" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<rect x="350" y="120" width="290" height="258" rx="12" class="pill"/><text x="366" y="144" class="pt">Quality checks</text>
<rect x="366" y="156" width="258" height="30" rx="7" fill="none" stroke="#30363d"/><circle cx="382" cy="171" r="7" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="398" y="175" class="sub" style="font-size:10px">Delivery completeness</text>
<rect x="366" y="192" width="258" height="30" rx="7" fill="none" stroke="#30363d"/><circle cx="382" cy="207" r="7" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="398" y="211" class="sub" style="font-size:10px">Required fields present</text>
<rect x="366" y="228" width="258" height="30" rx="7" fill="none" stroke="#30363d"/><circle cx="382" cy="243" r="7" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="398" y="247" class="sub" style="font-size:10px">Data types readable</text>
<rect x="366" y="264" width="258" height="30" rx="7" fill="none" stroke="#30363d"/><circle cx="382" cy="279" r="7" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="398" y="283" class="sub" style="font-size:10px">Valid change flags</text>
<rect x="366" y="300" width="258" height="30" rx="7" fill="none" stroke="#30363d"/><circle cx="382" cy="315" r="7" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="398" y="319" class="sub" style="font-size:10px">No duplicate business keys</text>
<rect x="366" y="336" width="258" height="30" rx="7" fill="none" stroke="#30363d"/><circle cx="382" cy="351" r="7" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="398" y="355" class="sub" style="font-size:10px">Reconciliation of counts</text>
<rect x="350" y="394" width="290" height="62" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<rect x="670" y="120" width="260" height="130" rx="12" class="pill"/><text x="686" y="144" class="pt">Silver Delta</text><text x="686" y="160" class="sub" style="font-size:10px">current state, one record per key</text>
<rect x="686" y="176" width="228" height="48" rx="8" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="800" y="205" text-anchor="middle" class="sub">empty</text>
<rect x="670" y="274" width="260" height="104" rx="12" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<line x1="30" y1="588" x2="930" y2="588" stroke="#1c2128"/>
<text x="30" y="612" class="note">Proposed design. Names such as load_mode and the underscore-prefixed metadata columns are ours, not Walmart's. Example values are made up.</text>
<text x="30" y="630" class="note">Silver and QC details still need to be matched to the team's existing implementation.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0100;0.0130;0.2000;0.2030;1" values="0;0;1;1;0;0"/><rect x="30" y="120" width="290" height="180" rx="12" fill="none" stroke="#58a6ff" stroke-width="2"/></g><text x="30" y="542" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.1980;0.2010;1" values="0;0;1;1;0;0"/>1. Bronze keeps both records</text><text x="30" y="562" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.1980;0.2010;1" values="0;0;1;1;0;0"/>The original delivery and the later correction stay in Bronze for traceability. Corrected data must remain distinguishable from the original.</text><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2200;0.2230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="366" y="156" width="258" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="382" cy="171" r="7" fill="#3fb950"/><path d="M378,171 l3,3 l5,-6" fill="none" stroke="#0d1117" stroke-width="2"/><text x="398" y="175" class="hdr" style="font-size:10px">Delivery completeness</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2550;0.2580;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="366" y="192" width="258" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="382" cy="207" r="7" fill="#3fb950"/><path d="M378,207 l3,3 l5,-6" fill="none" stroke="#0d1117" stroke-width="2"/><text x="398" y="211" class="hdr" style="font-size:10px">Required fields present</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2900;0.2930;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="366" y="228" width="258" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="382" cy="243" r="7" fill="#3fb950"/><path d="M378,243 l3,3 l5,-6" fill="none" stroke="#0d1117" stroke-width="2"/><text x="398" y="247" class="hdr" style="font-size:10px">Data types readable</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.3250;0.3280;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="366" y="264" width="258" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="382" cy="279" r="7" fill="#3fb950"/><path d="M378,279 l3,3 l5,-6" fill="none" stroke="#0d1117" stroke-width="2"/><text x="398" y="283" class="hdr" style="font-size:10px">Valid change flags</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.3600;0.3630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="366" y="300" width="258" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="382" cy="315" r="7" fill="#3fb950"/><path d="M378,315 l3,3 l5,-6" fill="none" stroke="#0d1117" stroke-width="2"/><text x="398" y="319" class="hdr" style="font-size:10px">No duplicate business keys</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.3950;0.3980;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="366" y="336" width="258" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="382" cy="351" r="7" fill="#3fb950"/><path d="M378,351 l3,3 l5,-6" fill="none" stroke="#0d1117" stroke-width="2"/><text x="398" y="355" class="hdr" style="font-size:10px">Reconciliation of counts</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2000;0.2030;0.2600;0.2630;1" values="0;0;1;1;0;0"/><animateMotion dur="44s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2000;0.2600;1" calcMode="linear" path="M320,210 H350"/></circle><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.4400;0.4430;0.5000;0.5030;1" values="0;0;1;1;0;0"/><rect x="350" y="394" width="290" height="62" rx="10" fill="#2d1315" stroke="#f85149" stroke-width="2"/><text x="366" y="418" class="pt">Quarantine / error details</text><text x="366" y="436" class="sub" style="font-size:10px;fill:#c9d1d9">a failing record is kept here with its rule</text></g><text x="30" y="542" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2020;0.2050;0.4980;0.5010;1" values="0;0;1;1;0;0"/>2. Quality checks run before applying</text><text x="30" y="562" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2020;0.2050;0.4980;0.5010;1" values="0;0;1;1;0;0"/>Records are checked for completeness, required fields, types, valid flags, uniqueness and reconciliation. Invalid records go to quarantine, and critical errors block the delivery.</text><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.5000;0.5030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="30" y="320" width="290" height="110" rx="12" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="46" y="344" class="pt">Order and key rules</text><text x="46" y="364" class="sub" style="font-size:10px;fill:#c9d1d9">deliveries in generated-date order</text><text x="46" y="380" class="sub" style="font-size:10px;fill:#c9d1d9">inside a delivery: D, then I, then U</text><text x="46" y="396" class="sub" style="font-size:10px;fill:#c9d1d9">match on the full business key:</text><text x="46" y="412" class="sub" style="font-size:10px;fill:#c9d1d9">store, item, channel, date and more</text></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.5200;0.5230;0.5800;0.5830;1" values="0;0;1;1;0;0"/><animateMotion dur="44s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5200;0.5800;1" calcMode="linear" path="M640,250 H670"/></circle><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.5600;0.5630;0.7000;0.7030;1" values="0;0;1;1;0;0"/><rect x="686" y="176" width="228" height="48" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="800" y="196" text-anchor="middle" class="pt">5 Oct   amount 1,000</text><text x="800" y="213" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">flag I: record added</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.7000;0.7030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="686" y="176" width="228" height="48" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="800" y="196" text-anchor="middle" class="pt">5 Oct   amount 900</text><text x="800" y="213" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">flag U: matching record updated</text></g><text x="30" y="542" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>3. Apply insert, update and delete</text><text x="30" y="562" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>The first delivery inserts 1,000. The later update changes that same record to 900. This is done with MERGE-style logic on the full business key.</text><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.7700;0.7730;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="670" y="274" width="260" height="104" rx="12" fill="#11161d" stroke="#f85149" stroke-width="1.5"/><text x="686" y="298" class="pt">Appending everything</text><text x="686" y="320" class="sub" style="font-size:10px;fill:#c9d1d9">1,000 + 900 = 1,900 (wrong)</text><path d="M686,336 H900" stroke="#f85149" stroke-width="2"/><text x="686" y="360" class="grn">MERGE result: 900 (correct)</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.8200;0.8230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="350" y="478" class="note">Bronze has 2 change records, Silver has 1 current record.</text><text x="350" y="494" class="note">Counts need not match; reconciliation accounts for updates and deletes.</text></g><text x="30" y="542" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.7520;0.7550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>4. Why appending is wrong</text><text x="30" y="562" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.7520;0.7550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Simply appending Bronze into Silver would double-count the original and the correction. Silver holds the current corrected state.</text></g>
</svg>