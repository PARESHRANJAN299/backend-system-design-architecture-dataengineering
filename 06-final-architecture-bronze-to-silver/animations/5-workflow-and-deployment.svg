<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
<title id="t">Workflow, schedule and deployment</title><desc id="d">A scheduled Databricks job runs three dependent tasks: ingest and verify Bronze, transform validate and apply to Silver, then reconcile and report. A failure in an earlier task blocks the later ones and sends a notification. An Asset Bundle deploys the code and job configuration to Sandbox and Production, with environment-specific settings kept separate and the private key never included.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="640" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="612" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Workflow, schedule and deployment</text>
<text x="30" y="84" class="s">dependent tasks, a safe failure path, and one bundle for two environments</text>
<rect x="30" y="112" width="500" height="318" rx="14" class="zone"/><text x="46" y="134" class="col">DATABRICKS JOB, 6:00 PM (TIMEZONE TO CONFIRM)</text>
<rect x="60" y="152" width="440" height="64" rx="10" class="pill"/><text x="76" y="178" class="dim">Task 1</text><text x="76" y="198" class="sub" style="font-size:11px">Ingest and verify Bronze deliveries</text>
<path class="flow" d="M280,216 V252"/>
<rect x="60" y="252" width="440" height="64" rx="10" class="pill"/><text x="76" y="278" class="dim">Task 2</text><text x="76" y="298" class="sub" style="font-size:11px">Transform, validate, apply to Silver</text>
<path class="flow" d="M280,316 V352"/>
<rect x="60" y="352" width="440" height="64" rx="10" class="pill"/><text x="76" y="378" class="dim">Task 3</text><text x="76" y="398" class="sub" style="font-size:11px">Reconcile results, report completion</text>
<rect x="560" y="112" width="370" height="318" rx="14" class="zone"/><text x="576" y="134" class="col">ASSET BUNDLE</text>
<rect x="576" y="150" width="338" height="62" rx="10" class="pill"/><text x="592" y="174" class="pt">Code + job configuration</text><text x="592" y="194" class="sub" style="font-size:10px">tasks, dependencies, parameters, notifications</text>
<rect x="576" y="254" width="160" height="62" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="656" y="290" text-anchor="middle" class="dim">Sandbox</text>
<rect x="754" y="254" width="160" height="62" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="834" y="290" text-anchor="middle" class="dim">Production</text>
<path class="flow" d="M745,212 V232 H656 V254 M745,232 H834 V254"/>
<rect x="576" y="338" width="338" height="78" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<line x1="30" y1="568" x2="930" y2="568" stroke="#1c2128"/>
<text x="30" y="592" class="note">Proposed design. Names such as load_mode and the underscore-prefixed metadata columns are ours, not Walmart's. Example values are made up.</text>
<text x="30" y="610" class="note">The 6:00 PM schedule needs its timezone confirmed before sign-off.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0100;0.0130;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="30" y="112" width="500" height="318" rx="14" fill="none" stroke="#58a6ff" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0300;0.0330;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="60" y="152" width="440" height="64" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="76" y="178" class="pt">Task 1</text><text x="76" y="198" class="sub" style="font-size:11px;fill:#c9d1d9">Ingest and verify Bronze deliveries</text></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0700;0.0730;0.1200;0.1230;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0700;0.1200;1" calcMode="linear" path="M280,216 V252"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1200;0.1230;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="60" y="252" width="440" height="64" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="76" y="278" class="pt">Task 2</text><text x="76" y="298" class="sub" style="font-size:11px;fill:#c9d1d9">Transform, validate, apply to Silver</text></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1600;0.1630;0.2100;0.2130;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1600;0.2100;1" calcMode="linear" path="M280,316 V352"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2100;0.2130;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="60" y="352" width="440" height="64" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="76" y="378" class="pt">Task 3</text><text x="76" y="398" class="sub" style="font-size:11px;fill:#c9d1d9">Reconcile results, report completion</text></g><text x="30" y="522" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2980;0.3010;1" values="0;0;1;1;0;0"/>1. The scheduled job runs three dependent tasks</text><text x="30" y="542" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2980;0.3010;1" values="0;0;1;1;0;0"/>Each task starts only after the one before it succeeds, so Silver never processes a Bronze delivery that did not finish.</text><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3200;0.3230;0.5800;0.5830;1" values="0;0;1;1;0;0"/><rect x="60" y="152" width="440" height="64" rx="10" fill="#2d1315" stroke="#f85149" stroke-width="2"/><text x="76" y="178" class="pt">Task 1</text><text x="76" y="198" class="amb">failed</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.4000;0.4030;0.5800;0.5830;1" values="0;0;1;1;0;0"/><rect x="60" y="252" width="440" height="64" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2" stroke-dasharray="5 5"/><text x="76" y="278" class="dim">Task 2</text><text x="76" y="298" class="sub" style="font-size:11px">not run: upstream task failed</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.4000;0.4030;0.5800;0.5830;1" values="0;0;1;1;0;0"/><rect x="60" y="352" width="440" height="64" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2" stroke-dasharray="5 5"/><text x="76" y="378" class="dim">Task 3</text><text x="76" y="398" class="sub" style="font-size:11px">not run: upstream task failed</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.4600;0.4630;0.5800;0.5830;1" values="0;0;1;1;0;0"/><rect x="196" y="438" width="260" height="26" rx="13" fill="#2a2110" stroke="#d29922" stroke-width="1.5"/><text x="326" y="455" text-anchor="middle" class="amb">failure notification sent</text></g><text x="30" y="522" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3020;0.3050;0.5780;0.5810;1" values="0;0;1;1;0;0"/>2. A failure blocks the rest and notifies</text><text x="30" y="542" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3020;0.3050;0.5780;0.5810;1" values="0;0;1;1;0;0"/>Dependencies stop the downstream tasks, and a failure notification goes out. A separate overdue-load check catches a job that stopped running at all.</text><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6000;0.6030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="576" y="150" width="338" height="62" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="592" y="174" class="pt">Code + job configuration</text><text x="592" y="194" class="sub" style="font-size:10px;fill:#c9d1d9">tasks, dependencies, parameters, notifications</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6400;0.6430;0.7000;0.7030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6400;0.7000;1" calcMode="linear" path="M745,212 V232 H656 V254"/></circle><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6400;0.6430;0.7000;0.7030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6400;0.7000;1" calcMode="linear" path="M745,232 H834 V254"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7000;0.7030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="576" y="254" width="160" height="62" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="656" y="290" text-anchor="middle" class="pt">Sandbox</text><rect x="754" y="254" width="160" height="62" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="834" y="290" text-anchor="middle" class="pt">Production</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7800;0.7830;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="576" y="338" width="338" height="78" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="592" y="360" class="pt">Kept separate per environment</text><text x="592" y="378" class="sub" style="font-size:10px;fill:#c9d1d9">table names, compute, identities, key references</text><g transform="translate(598,398)"><use href="#lock"/></g><text x="612" y="402" class="amb">the private key itself is never in the bundle</text></g><text x="30" y="522" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5820;0.5850;0.9980;1.0010;1" values="0;0;1;1;0;0"/>3. One bundle, two environments</text><text x="30" y="542" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5820;0.5850;0.9980;1.0010;1" values="0;0;1;1;0;0"/>The Asset Bundle deploys the same code and job configuration to Sandbox and Production. Environment-specific settings stay separate, and only a reference to the key is configured.</text></g>
</svg>