<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
<title id="t">Recovering from the right stage</title><desc id="d">A control table records Bronze and Silver status separately for each delivery. A delivery that never reached Bronze is requested from Walmart again, one that reached Bronze but failed in Silver is reprocessed from Bronze without downloading, and one that succeeded in both stages is skipped.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="620" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="592" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Recovering from the right stage</text>
<text x="30" y="84" class="s">Bronze and Silver are tracked separately</text>
<text x="30" y="118" class="col">CONTROL TABLE</text><text x="250" y="118" class="col">BRONZE</text><text x="360" y="118" class="col">SILVER</text><text x="590" y="118" class="col">WHAT WE DO</text>
<rect x="30" y="134" width="500" height="64" rx="10" class="pill"/><text x="46" y="172" class="pt">5 Oct</text><text x="104" y="164" class="sub" style="font-size:10px">feed, file identity,</text><text x="104" y="178" class="sub" style="font-size:10px">row counts, errors</text>
<rect x="240" y="150" width="92" height="32" rx="16" fill="none" stroke="#30363d"/><rect x="350" y="150" width="92" height="32" rx="16" fill="none" stroke="#30363d"/>
<path class="flow" d="M530,166 H580"/><rect x="580" y="134" width="350" height="64" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<rect x="30" y="214" width="500" height="64" rx="10" class="pill"/><text x="46" y="252" class="pt">6 Oct</text><text x="104" y="244" class="sub" style="font-size:10px">feed, file identity,</text><text x="104" y="258" class="sub" style="font-size:10px">row counts, errors</text>
<rect x="240" y="230" width="92" height="32" rx="16" fill="none" stroke="#30363d"/><rect x="350" y="230" width="92" height="32" rx="16" fill="none" stroke="#30363d"/>
<path class="flow" d="M530,246 H580"/><rect x="580" y="214" width="350" height="64" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<rect x="30" y="294" width="500" height="64" rx="10" class="pill"/><text x="46" y="332" class="pt">7 Oct</text><text x="104" y="324" class="sub" style="font-size:10px">feed, file identity,</text><text x="104" y="338" class="sub" style="font-size:10px">row counts, errors</text>
<rect x="240" y="310" width="92" height="32" rx="16" fill="none" stroke="#30363d"/><rect x="350" y="310" width="92" height="32" rx="16" fill="none" stroke="#30363d"/>
<path class="flow" d="M530,326 H580"/><rect x="580" y="294" width="350" height="64" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<line x1="30" y1="548" x2="930" y2="548" stroke="#1c2128"/>
<text x="30" y="572" class="note">Proposed design. Names such as load_mode and the underscore-prefixed metadata columns are ours, not Walmart's. Example values are made up.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="240" y="150" width="92" height="32" rx="16" fill="#2a2110" stroke="#d29922" stroke-width="1.5"/><text x="286" y="171" text-anchor="middle" class="amb">missing</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="350" y="150" width="92" height="32" rx="16" fill="none" stroke="#30363d"/><text x="396" y="171" text-anchor="middle" class="sub">not started</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0900;0.0930;0.1400;0.1430;1" values="0;0;1;1;0;0"/><animateMotion dur="36s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0900;0.1400;1" calcMode="linear" path="M530,166 H580"/></circle><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.1200;0.1230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="580" y="134" width="350" height="64" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="594" y="160" class="hdr" style="font-size:11px">Request the missing delivery from Walmart and</text><text x="594" y="176" class="hdr" style="font-size:11px">ingest it.</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.2400;0.2430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="240" y="230" width="92" height="32" rx="16" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="286" y="251" text-anchor="middle" class="grn">complete</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.2800;0.2830;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="350" y="230" width="92" height="32" rx="16" fill="#2d1315" stroke="#f85149" stroke-width="1.5"/><text x="396" y="251" text-anchor="middle" class="amb">failed</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3100;0.3130;0.3600;0.3630;1" values="0;0;1;1;0;0"/><animateMotion dur="36s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3100;0.3600;1" calcMode="linear" path="M530,246 H580"/></circle><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3400;0.3430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="580" y="214" width="350" height="64" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="594" y="240" class="hdr" style="font-size:11px">Reprocess from Bronze. Do not download from</text><text x="594" y="256" class="hdr" style="font-size:11px">Walmart again.</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.4600;0.4630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="240" y="310" width="92" height="32" rx="16" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="286" y="331" text-anchor="middle" class="grn">complete</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.5000;0.5030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="350" y="310" width="92" height="32" rx="16" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="396" y="331" text-anchor="middle" class="grn">complete</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.5300;0.5330;0.5800;0.5830;1" values="0;0;1;1;0;0"/><animateMotion dur="36s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5300;0.5800;1" calcMode="linear" path="M530,326 H580"/></circle><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.5600;0.5630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="580" y="294" width="350" height="64" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="594" y="320" class="hdr" style="font-size:11px">Skip it, unless a new source version is</text><text x="594" y="336" class="hdr" style="font-size:11px">published.</text></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.6780;0.6810;1" values="0;0;1;1;0;0"/>Recover from the stage that failed</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.6780;0.6810;1" values="0;0;1;1;0;0"/>Never download again what is already in Bronze, and never skip what is missing. Recovery follows the status of each stage.</text><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.7000;0.7030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="30" y="384" width="440" height="84" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="46" y="408" class="pt">Recover in source order</text><text x="46" y="428" class="sub" style="font-size:10px;fill:#c9d1d9">If newer changes already reached Silver, replay the affected</text><text x="46" y="444" class="sub" style="font-size:10px;fill:#c9d1d9">records in order. Never apply an older change afterward.</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="490" y="384" width="440" height="84" rx="10" fill="#11161d" stroke="#d29922" stroke-width="1.5"/><text x="506" y="408" class="pt">Mind the 45-day window</text><text x="506" y="428" class="sub" style="font-size:10px;fill:#c9d1d9">Walmart keeps incremental and history files for up to 45 days.</text><text x="506" y="444" class="sub" style="font-size:10px;fill:#c9d1d9">Missing-source recovery must happen while they are available.</text></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.7020;0.7050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Order and retention rules</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.7020;0.7050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Walmart requires feed-generation order to be preserved. Files must still be available at the source to be requested again.</text></g>
</svg>