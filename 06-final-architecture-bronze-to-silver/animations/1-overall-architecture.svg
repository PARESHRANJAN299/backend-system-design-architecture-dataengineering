<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t d">
<title id="t">Final architecture: Walmart to Bronze to Silver</title><desc id="d">A scheduled Databricks job identifies new or missed Walmart deliveries, authenticates, requests data, retrieves the files from signed download links and writes them directly into Bronze Delta with ingestion metadata. Downstream, completed Bronze deliveries are transformed and quality checked; invalid records go to quarantine and valid changes are applied to Silver Delta for reporting. A control table tracks Bronze and Silver separately.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="700" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="672" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Final architecture: Walmart to Bronze to Silver</text>
<text x="30" y="84" class="s">ingest directly into Bronze, then clean and validate into Silver</text>
<text x="30" y="124" class="col">OUR SCOPE: INGEST TO BRONZE, WITH TRACKING</text>
<text x="30" y="284" class="col">DOWNSTREAM HANDOFF: SILVER AND QC (TO MATCH THE TEAM'S EXISTING IMPLEMENTATION)</text>
<rect x="30" y="140" width="130" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="95" y="172" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Scheduled job</text><text x="95" y="188" text-anchor="middle" class="sub" style="font-size:10px;">Databricks job</text>
<path class="flow" d="M160,175 H184"/>
<rect x="184" y="140" width="130" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="249" y="172" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Identify deliveries</text><text x="249" y="188" text-anchor="middle" class="sub" style="font-size:10px;">new or missed</text>
<path class="flow" d="M314,175 H338"/>
<rect x="338" y="140" width="130" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="403" y="172" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Authenticate</text><text x="403" y="188" text-anchor="middle" class="sub" style="font-size:10px;">then request data</text>
<path class="flow" d="M468,175 H492"/>
<rect x="492" y="140" width="130" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="557" y="172" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Download links</text><text x="557" y="188" text-anchor="middle" class="sub" style="font-size:10px;">signed URLs</text>
<path class="flow" d="M622,175 H646"/>
<rect x="646" y="140" width="130" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="711" y="172" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Retrieve + read</text><text x="711" y="188" text-anchor="middle" class="sub" style="font-size:10px;">files in batches</text>
<path class="flow" d="M776,175 H800"/>
<rect x="800" y="140" width="130" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="865" y="172" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">BRONZE DELTA</text><text x="865" y="188" text-anchor="middle" class="sub" style="font-size:10px;">source + metadata</text>
<rect x="30" y="300" width="150" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="105" y="332" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Read Bronze</text><text x="105" y="348" text-anchor="middle" class="sub" style="font-size:10px;">completed deliveries</text>
<path class="flow" d="M180,335 H205"/>
<rect x="205" y="300" width="150" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="280" y="332" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Silver transform</text><text x="280" y="348" text-anchor="middle" class="sub" style="font-size:10px;">+ quality checks</text>
<path class="flow" d="M355,335 H380"/>
<rect x="380" y="300" width="150" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="455" y="332" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Apply changes</text><text x="455" y="348" text-anchor="middle" class="sub" style="font-size:10px;">insert, update, delete</text>
<path class="flow" d="M530,335 H555"/>
<rect x="555" y="300" width="150" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="630" y="332" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">SILVER DELTA</text><text x="630" y="348" text-anchor="middle" class="sub" style="font-size:10px;">validated data</text>
<path class="flow" d="M705,335 H730"/>
<rect x="730" y="300" width="150" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="805" y="332" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Reporting</text><text x="805" y="348" text-anchor="middle" class="sub" style="font-size:10px;">downstream analysis</text>
<path class="flow" d="M865,210 V256 H105 V300" stroke-dasharray="4 4"/>
<rect x="205" y="410" width="150" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="280" y="437" text-anchor="middle" class="pt" style="font-size:12px;fill:#8b949e">Quarantine</text><text x="280" y="453" text-anchor="middle" class="sub" style="font-size:10px;">failed rule + record</text>
<path class="flow" d="M280,370 V410"/>
<rect x="30" y="500" width="900" height="50" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/><text x="46" y="520" class="pt" style="fill:#8b949e">Control table</text><text x="46" y="538" class="sub" style="font-size:10px">per delivery: file identity, row counts, errors</text>
<line x1="30" y1="628" x2="930" y2="628" stroke="#1c2128"/>
<text x="30" y="652" class="note">Proposed design. Names such as load_mode and the underscore-prefixed metadata columns are ours, not Walmart's. Example values are made up.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.1000;0.1030;1" values="0;0;1;1;0;0"/><rect x="30" y="140" width="130" height="70" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="95" y="172" text-anchor="middle" class="pt" style="font-size:12px">Scheduled job</text><text x="95" y="188" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">Databricks job</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0750;0.0780;0.1550;0.1580;1" values="0;0;1;1;0;0"/><rect x="184" y="140" width="130" height="70" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="249" y="172" text-anchor="middle" class="pt" style="font-size:12px">Identify deliveries</text><text x="249" y="188" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">new or missed</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.1300;0.1330;0.2100;0.2130;1" values="0;0;1;1;0;0"/><rect x="338" y="140" width="130" height="70" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="403" y="172" text-anchor="middle" class="pt" style="font-size:12px">Authenticate</text><text x="403" y="188" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">then request data</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.1850;0.1880;0.2650;0.2680;1" values="0;0;1;1;0;0"/><rect x="492" y="140" width="130" height="70" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="557" y="172" text-anchor="middle" class="pt" style="font-size:12px">Download links</text><text x="557" y="188" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">signed URLs</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2400;0.2430;0.3200;0.3230;1" values="0;0;1;1;0;0"/><rect x="646" y="140" width="130" height="70" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="711" y="172" text-anchor="middle" class="pt" style="font-size:12px">Retrieve + read</text><text x="711" y="188" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">files in batches</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.2950;0.2980;0.3600;0.3630;1" values="0;0;1;1;0;0"/><rect x="800" y="140" width="130" height="70" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="865" y="172" text-anchor="middle" class="pt" style="font-size:12px">BRONZE DELTA</text><text x="865" y="188" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">source + metadata</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.3400;0.3430;1" values="0;0;1;1;0;0"/><animateMotion dur="44s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0200;0.3400;1" calcMode="linear" path="M95,175 H865"/></circle><text x="30" y="582" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.3580;0.3610;1" values="0;0;1;1;0;0"/>1. Ingest: Walmart to Bronze</text><text x="30" y="602" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.3580;0.3610;1" values="0;0;1;1;0;0"/>The job finds new or missed deliveries, authenticates, requests the data, retrieves the files and writes them straight into Bronze Delta, with no landing layer.</text><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.3700;0.3730;0.4400;0.4430;1" values="0;0;1;1;0;0"/><animateMotion dur="44s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3700;0.4400;1" calcMode="linear" path="M865,210 V256 H105 V300"/></circle><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.4000;0.4030;0.4700;0.4730;1" values="0;0;1;1;0;0"/><rect x="30" y="300" width="150" height="70" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="105" y="332" text-anchor="middle" class="pt" style="font-size:12px">Read Bronze</text><text x="105" y="348" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">completed deliveries</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.4450;0.4480;0.5150;0.5180;1" values="0;0;1;1;0;0"/><rect x="205" y="300" width="150" height="70" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="280" y="332" text-anchor="middle" class="pt" style="font-size:12px">Silver transform</text><text x="280" y="348" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">+ quality checks</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.4900;0.4930;0.5600;0.5630;1" values="0;0;1;1;0;0"/><rect x="380" y="300" width="150" height="70" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="455" y="332" text-anchor="middle" class="pt" style="font-size:12px">Apply changes</text><text x="455" y="348" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">insert, update, delete</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.5350;0.5380;0.6050;0.6080;1" values="0;0;1;1;0;0"/><rect x="555" y="300" width="150" height="70" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="630" y="332" text-anchor="middle" class="pt" style="font-size:12px">SILVER DELTA</text><text x="630" y="348" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">validated data</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.5800;0.5830;0.6200;0.6230;1" values="0;0;1;1;0;0"/><rect x="730" y="300" width="150" height="70" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="805" y="332" text-anchor="middle" class="pt" style="font-size:12px">Reporting</text><text x="805" y="348" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">downstream analysis</text></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.4200;0.4230;0.6000;0.6030;1" values="0;0;1;1;0;0"/><animateMotion dur="44s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4200;0.6000;1" calcMode="linear" path="M105,335 H805"/></circle><text x="30" y="582" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.3620;0.3650;0.6180;0.6210;1" values="0;0;1;1;0;0"/>2. Transform into Silver</text><text x="30" y="602" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.3620;0.3650;0.6180;0.6210;1" values="0;0;1;1;0;0"/>Only completed Bronze deliveries are read. Valid records pass the quality checks, and the insert, update and delete instructions are applied to Silver Delta for reporting.</text><circle r="5" fill="#f85149" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.6300;0.6330;0.7000;0.7030;1" values="0;0;1;1;0;0"/><animateMotion dur="44s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6300;0.7000;1" calcMode="linear" path="M280,370 V410"/></circle><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.6800;0.6830;0.8000;0.8030;1" values="0;0;1;1;0;0"/><rect x="205" y="410" width="150" height="60" rx="10" fill="#2d1315" stroke="#f85149" stroke-width="2"/><text x="280" y="437" text-anchor="middle" class="pt" style="font-size:12px">Quarantine</text><text x="280" y="453" text-anchor="middle" class="sub" style="font-size:10px;fill:#c9d1d9">failed rule + record</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.6800;0.6830;0.8000;0.8030;1" values="0;0;1;1;0;0"/><text x="375" y="436" class="note">critical error blocks that Silver delivery;</text><text x="375" y="452" class="note">the raw record stays in Bronze for reprocessing</text></g><text x="30" y="582" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.6220;0.6250;0.7980;0.8010;1" values="0;0;1;1;0;0"/>3. Invalid data is quarantined</text><text x="30" y="602" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.6220;0.6250;0.7980;0.8010;1" values="0;0;1;1;0;0"/>A record that fails a rule goes to the quarantine table with the failed rule. After the cause is fixed, the delivery is reprocessed from Bronze.</text><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.8200;0.8230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="30" y="500" width="900" height="50" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="46" y="520" class="pt">Control table</text><text x="46" y="538" class="sub" style="font-size:10px;fill:#c9d1d9">per delivery: file identity, row counts, errors</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.8400;0.8430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="560" y="512" width="170" height="26" rx="13" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="645" y="529" text-anchor="middle" class="grn">Bronze: complete</text></g><g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.9000;0.9030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="750" y="512" width="170" height="26" rx="13" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="835" y="529" text-anchor="middle" class="grn">Silver: complete</text></g><text x="30" y="582" class="pt" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.8020;0.8050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>4. Track both stages separately</text><text x="30" y="602" class="body" opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" keyTimes="0;0.8020;0.8050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Bronze and Silver each have their own status per delivery, so a failure can be recovered from the right stage.</text></g>
</svg>