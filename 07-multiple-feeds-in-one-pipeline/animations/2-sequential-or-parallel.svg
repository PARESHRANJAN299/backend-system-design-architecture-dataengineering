<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
<title id="t">Sequential or parallel inside one job</title><desc id="d">Two ways to run the feed requests in one job: one after the other in a loop, or as separate tasks that run at the same time. Either way each feed writes to its own Bronze table and is tracked per feed and delivery date.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="580" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="552" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Sequential or parallel inside one job</text>
<text x="30" y="84" class="s">both are valid; the existing job configuration tells which one is used</text>
<rect x="30" y="112" width="900" height="130" rx="12" class="pill"/><text x="46" y="136" class="pt">Option A. One after the other</text><text x="46" y="154" class="sub" style="font-size:10px">a loop over the configured feeds</text>
<rect x="30" y="262" width="900" height="130" rx="12" class="pill"/><text x="46" y="286" class="pt">Option B. At the same time</text><text x="46" y="304" class="sub" style="font-size:10px">separate parallel tasks in one job</text>
<text x="280" y="134" class="sub" style="font-size:10px">time goes right</text><text x="280" y="284" class="sub" style="font-size:10px">time goes right</text>
<rect x="280" y="160" width="280" height="34" rx="7" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
<rect x="580" y="160" width="280" height="34" rx="7" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
<rect x="280" y="310" width="280" height="34" rx="7" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
<rect x="280" y="350" width="280" height="34" rx="7" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
<line x1="30" y1="508" x2="930" y2="508" stroke="#1c2128"/>
<text x="30" y="532" class="note">Proposed design. Table names are illustrative. Endpoint paths are from my notes on Walmart's endpoint list, not checked against the API reference.</text>
<g class="anim"><g><rect x="280" y="160" width="0" height="34" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"><animate attributeName="width" dur="36s" repeatCount="indefinite" keyTimes="0;0.0400;0.3000;0.995;1" values="0;0;280;280;0"/></rect></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0450;0.0480;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="420" y="181" text-anchor="middle" class="pt" style="font-size:12px">Store Sales</text></g><g><rect x="580" y="160" width="0" height="34" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"><animate attributeName="width" dur="36s" repeatCount="indefinite" keyTimes="0;0.3000;0.5600;0.995;1" values="0;0;280;280;0"/></rect></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3050;0.3080;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="720" y="181" text-anchor="middle" class="pt" style="font-size:12px">Omni Sales</text></g><g><rect x="280" y="310" width="0" height="34" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"><animate attributeName="width" dur="36s" repeatCount="indefinite" keyTimes="0;0.0400;0.3000;0.995;1" values="0;0;280;280;0"/></rect></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0450;0.0480;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="420" y="331" text-anchor="middle" class="pt" style="font-size:12px">Store Sales</text></g><g><rect x="280" y="350" width="0" height="34" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"><animate attributeName="width" dur="36s" repeatCount="indefinite" keyTimes="0;0.0400;0.3000;0.995;1" values="0;0;280;280;0"/></rect></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0450;0.0480;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="420" y="371" text-anchor="middle" class="pt" style="font-size:12px">Omni Sales</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.5600;0.5630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="580" y="214" class="note">total time: both feeds added together</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3000;0.3030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="580" y="372" class="note">total time: about the longer of the two</text></g><text x="30" y="462" class="pt" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.5780;0.5810;1" values="0;0;1;1;0;0"/>Same work, different timing</text><text x="30" y="482" class="body" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.5780;0.5810;1" values="0;0;1;1;0;0"/>In A the second request starts when the first finishes. In B both requests run together. Databricks supports dependent and parallel tasks within one job.</text><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.6000;0.6030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="30" y="410" width="440" height="40" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="46" y="434" class="pt" style="font-size:12px">Either way: each feed writes to its own Bronze table</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.7000;0.7030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="490" y="410" width="440" height="40" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="506" y="434" class="pt" style="font-size:12px">Either way: tracked per feed and delivery date</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="30" y="470" class="note">Which one the existing pipeline uses has not been inspected yet. The notebook or job configuration will show it.</text></g><text x="30" y="462" class="pt" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.6020;0.6050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>What does not change</text><text x="30" y="482" class="body" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.6020;0.6050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Parallel or sequential, the result is the same: one request per feed, one Bronze table per feed.</text></g>
</svg>