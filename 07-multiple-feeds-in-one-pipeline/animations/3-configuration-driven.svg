<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
<title id="t">A configuration-driven pipeline</title><desc id="d">The pipeline code loops over a configuration of approved feeds. Each configured feed is signed, requested, read and written to its own Bronze table. Adding a feed means a new configuration entry, approved access, a destination table and its business key and quality rules, not a new pipeline.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="620" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="592" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">A configuration-driven pipeline</text>
<text x="30" y="84" class="s">add a feed by adding configuration, not by building another pipeline</text>
<rect x="30" y="112" width="330" height="190" rx="12" class="pill"/><text x="46" y="136" class="pt">Feed configuration</text><text x="46" y="152" class="sub" style="font-size:10px">approved feeds, endpoint, destination</text>
<rect x="46" y="164" width="298" height="32" rx="7" fill="none" stroke="#30363d"/><text x="58" y="185" class="dim">Store Sales</text><text x="332" y="185" text-anchor="end" class="sub" style="font-size:10px">bronze.store_sales</text>
<rect x="46" y="204" width="298" height="32" rx="7" fill="none" stroke="#30363d"/><text x="58" y="225" class="dim">Omni Sales</text><text x="332" y="225" text-anchor="end" class="sub" style="font-size:10px">bronze.omni_sales</text>
<rect x="46" y="244" width="298" height="32" rx="7" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="195" y="264" text-anchor="middle" class="sub" style="font-size:10px">next feed (not added yet)</text>
<rect x="400" y="112" width="190" height="190" rx="12" class="pill"/><text x="495" y="140" text-anchor="middle" class="pt">Same pipeline code</text>
<text x="418" y="168" class="sub" style="font-size:11px">for each configured feed:</text>
<text x="418" y="192" class="sub" style="font-size:11px">sign the request</text>
<text x="418" y="216" class="sub" style="font-size:11px">request its endpoint</text>
<text x="418" y="240" class="sub" style="font-size:11px">read its files</text>
<text x="418" y="264" class="sub" style="font-size:11px">write its Bronze table</text>
<rect x="630" y="112" width="300" height="190" rx="12" class="pill"/><text x="646" y="136" class="pt">Bronze tables</text>
<rect x="646" y="164" width="268" height="32" rx="7" fill="none" stroke="#30363d"/><text x="660" y="185" class="dim">bronze.store_sales</text>
<rect x="646" y="204" width="268" height="32" rx="7" fill="none" stroke="#30363d"/><text x="660" y="225" class="dim">bronze.omni_sales</text>
<rect x="646" y="244" width="268" height="32" rx="7" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="780" y="264" text-anchor="middle" class="sub" style="font-size:10px">next table (not created yet)</text>
<path class="flow" d="M360,207 H400 M590,207 H630"/>
<line x1="30" y1="548" x2="930" y2="548" stroke="#1c2128"/>
<text x="30" y="572" class="note">Proposed design. Table names are illustrative. Endpoint paths are from my notes on Walmart's endpoint list, not checked against the API reference.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0300;0.0330;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="46" y="164" width="298" height="32" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="58" y="185" class="pt">Store Sales</text><text x="332" y="185" text-anchor="end" class="sub" style="font-size:10px;fill:#c9d1d9">bronze.store_sales</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0500;0.0530;0.1100;0.1130;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0500;0.1100;1" calcMode="linear" path="M344,180 C372,180 372,207 400,207"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0900;0.0930;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="646" y="164" width="268" height="32" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="660" y="185" class="pt">bronze.store_sales</text></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1100;0.1130;0.1700;0.1730;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1100;0.1700;1" calcMode="linear" path="M590,207 C610,207 610,180 646,180"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1300;0.1330;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="46" y="204" width="298" height="32" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="58" y="225" class="pt">Omni Sales</text><text x="332" y="225" text-anchor="end" class="sub" style="font-size:10px;fill:#c9d1d9">bronze.omni_sales</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1500;0.1530;0.2100;0.2130;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1500;0.2100;1" calcMode="linear" path="M344,220 C372,220 372,207 400,207"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1900;0.1930;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="646" y="204" width="268" height="32" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="660" y="225" class="pt">bronze.omni_sales</text></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2100;0.2130;0.2700;0.2730;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2100;0.2700;1" calcMode="linear" path="M590,207 C610,207 610,220 646,220"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0300;0.0330;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="400" y="112" width="190" height="190" rx="12" fill="none" stroke="#58a6ff" stroke-width="2"/></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2980;0.3010;1" values="0;0;1;1;0;0"/>1. The same code serves every configured feed</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2980;0.3010;1" values="0;0;1;1;0;0"/>The code does not change per feed. It loops over the configuration and writes each feed to the table configured for it.</text><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3400;0.3430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="46" y="244" width="298" height="32" rx="7" fill="#2a2110" stroke="#d29922" stroke-width="2"/><text x="58" y="265" class="pt">New feed</text><text x="332" y="265" text-anchor="end" class="sub" style="font-size:10px;fill:#c9d1d9">bronze.new_feed</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.4000;0.4030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="30" y="322" width="900" height="112" rx="12" fill="#11161d" stroke="#d29922" stroke-width="1.5"/><text x="46" y="346" class="pt">Before adding a feed</text><text x="46" y="368" class="hdr" style="font-size:11px">1. Our identity is approved for that feed.</text><text x="46" y="386" class="hdr" style="font-size:11px">2. Its endpoint path and destination Bronze table are decided.</text><text x="46" y="404" class="hdr" style="font-size:11px">3. Its full business key, change flags and quality rules are defined for Silver.</text><text x="46" y="422" class="hdr" style="font-size:11px">4. It is tracked in the control table by feed and delivery date.</text></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3220;0.3250;0.6180;0.6210;1" values="0;0;1;1;0;0"/>2. Adding a feed is a configuration decision</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3220;0.3250;0.6180;0.6210;1" values="0;0;1;1;0;0"/>A new feed needs approved access, an endpoint, a destination table and its own business key and quality rules.</text><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6400;0.6430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="400" y="112" width="190" height="190" rx="12" fill="none" stroke="#58a6ff" stroke-width="2"/></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6600;0.6630;0.7200;0.7230;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6600;0.7200;1" calcMode="linear" path="M344,260 C372,260 372,207 400,207"/></circle><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7400;0.7430;0.8000;0.8030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.7400;0.8000;1" calcMode="linear" path="M590,207 C610,207 610,260 646,260"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7800;0.7830;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="646" y="244" width="268" height="32" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="660" y="265" class="pt">bronze.new_feed</text></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6220;0.6250;0.9980;1.0010;1" values="0;0;1;1;0;0"/>3. Same pipeline, one more feed</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6220;0.6250;0.9980;1.0010;1" values="0;0;1;1;0;0"/>The new feed flows through the same code to its own Bronze table. No second pipeline or schedule is built.</text></g>
</svg>