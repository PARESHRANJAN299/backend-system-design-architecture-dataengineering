<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
<title id="t">What the pipeline does when a request does not succeed</title><desc id="d">Three different outcomes at the authentication gate: an expired signature is regenerated and retried, incorrect credentials or missing access stop the request and notify the responsible team, and no data available is recorded and not treated as an authentication failure.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="660" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="632" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Optional scene: failures and the final summary</text>
<text x="30" y="84" class="s">three different conditions, three different responses</text>
<rect x="40" y="196" width="130" height="70" rx="10" class="pill"/><text x="105" y="226" text-anchor="middle" class="pt">Request</text><text x="105" y="242" text-anchor="middle" class="sub">signed</text>
<rect x="250" y="176" width="150" height="110" rx="14" class="pill"/><text x="325" y="224" text-anchor="middle" class="pt">Walmart</text><text x="325" y="242" text-anchor="middle" class="pt">authentication</text><text x="325" y="260" text-anchor="middle" class="pt">gate</text>
<path class="flow" d="M170,231 H250"/>
<text x="470" y="114" class="col">WHAT WALMART REPORTS</text><text x="700" y="114" class="col">WHAT OUR PIPELINE DOES</text>
<path class="flow" d="M400,231 C430,231 430,150 460,150"/>
<rect x="460" y="120" width="220" height="60" rx="10" class="pill"/><text x="570" y="154" text-anchor="middle" class="dim">Signature expired</text>
<rect x="700" y="120" width="230" height="60" rx="10" class="pill"/>
<text x="715" y="142" class="sub">Generate a fresh signature and</text>
<text x="715" y="158" class="sub">timestamp, then retry.</text>
<path class="flow" d="M400,231 C430,231 430,240 460,240"/>
<rect x="460" y="210" width="220" height="60" rx="10" class="pill"/><text x="570" y="244" text-anchor="middle" class="dim">Incorrect credentials </text>
<text x="570" y="258" text-anchor="middle" class="dim">or missing access</text>
<rect x="700" y="210" width="230" height="60" rx="10" class="pill"/>
<text x="715" y="232" class="sub">Stop the affected request and</text>
<text x="715" y="248" class="sub">notify the responsible team.</text>
<path class="flow" d="M400,231 C430,231 430,330 460,330"/>
<rect x="460" y="300" width="220" height="60" rx="10" class="pill"/><text x="570" y="334" text-anchor="middle" class="dim">No data available</text>
<rect x="700" y="300" width="230" height="60" rx="10" class="pill"/>
<text x="715" y="322" class="sub">Record that outcome. It is not</text>
<text x="715" y="338" class="sub">an authentication failure.</text>
<line x1="30" y1="588" x2="930" y2="588" stroke="#1c2128"/>
<text x="30" y="612" class="note">Placeholder values only. No real private key, live signature or usable download URL is ever shown.</text>
<g class="anim"><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0100;0.0130;0.0500;0.0530;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0100;0.0500;1" calcMode="linear" path="M170,231 H250"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0100;0.0130;0.2450;0.2480;1" values="0;0;1;1;0;0"/><rect x="250" y="176" width="150" height="110" rx="14" fill="none" stroke="#d29922" stroke-width="2.5"/></g><circle r="5" fill="#d29922" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0600;0.0630;0.1000;0.1030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0600;0.1000;1" calcMode="linear" path="M400,231 C430,231 430,150 460,150"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1000;0.1030;0.2450;0.2480;1" values="0;0;1;1;0;0"/><rect x="460" y="120" width="220" height="60" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="570" y="154" text-anchor="middle" class="pt">Signature expired</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1400;0.1430;0.2450;0.2480;1" values="0;0;1;1;0;0"/><rect x="700" y="120" width="230" height="60" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="715" y="142" class="hdr">Generate a fresh signature and</text><text x="715" y="158" class="hdr">timestamp, then retry.</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2600;0.2630;0.3000;0.3030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2600;0.3000;1" calcMode="linear" path="M170,231 H250"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2600;0.2630;0.4950;0.4980;1" values="0;0;1;1;0;0"/><rect x="250" y="176" width="150" height="110" rx="14" fill="none" stroke="#f85149" stroke-width="2.5"/></g><circle r="5" fill="#f85149" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3100;0.3130;0.3500;0.3530;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3100;0.3500;1" calcMode="linear" path="M400,231 C430,231 430,240 460,240"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3500;0.3530;0.4950;0.4980;1" values="0;0;1;1;0;0"/><rect x="460" y="210" width="220" height="60" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="570" y="244" text-anchor="middle" class="pt">Incorrect credentials </text><text x="570" y="258" text-anchor="middle" class="pt">or missing access</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3900;0.3930;0.4950;0.4980;1" values="0;0;1;1;0;0"/><rect x="700" y="210" width="230" height="60" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="715" y="232" class="hdr">Stop the affected request and</text><text x="715" y="248" class="hdr">notify the responsible team.</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5100;0.5130;0.5500;0.5530;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5100;0.5500;1" calcMode="linear" path="M170,231 H250"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5100;0.5130;0.7450;0.7480;1" values="0;0;1;1;0;0"/><rect x="250" y="176" width="150" height="110" rx="14" fill="none" stroke="#8b949e" stroke-width="2.5"/></g><circle r="5" fill="#8b949e" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5600;0.5630;0.6000;0.6030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5600;0.6000;1" calcMode="linear" path="M400,231 C430,231 430,330 460,330"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6000;0.6030;0.7450;0.7480;1" values="0;0;1;1;0;0"/><rect x="460" y="300" width="220" height="60" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="570" y="334" text-anchor="middle" class="pt">No data available</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.6400;0.6430;0.7450;0.7480;1" values="0;0;1;1;0;0"/><rect x="700" y="300" width="230" height="60" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="715" y="322" class="hdr">Record that outcome. It is not</text><text x="715" y="338" class="hdr">an authentication failure.</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0400;0.0430;0.2450;0.2480;1" values="0;0;1;1;0;0"/><path d="M915,120 V100 H110 V196" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="5 5"/><text x="330" y="94" text-anchor="middle" class="amb">retry with the new signature</text></g><circle r="5" fill="#d29922" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1800;0.1830;0.2450;0.2480;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1800;0.2450;1" calcMode="linear" path="M915,120 V100 H110 V196"/></circle><text x="30" y="542" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2480;0.2510;1" values="0;0;1;1;0;0"/>Signature expired</text><text x="30" y="562" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2480;0.2510;1" values="0;0;1;1;0;0"/>A signature older than its 3-minute window is rejected. Generate a fresh one and retry.</text><text x="30" y="542" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2520;0.2550;0.4980;0.5010;1" values="0;0;1;1;0;0"/>Incorrect credentials or missing access</text><text x="30" y="562" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2520;0.2550;0.4980;0.5010;1" values="0;0;1;1;0;0"/>Retrying will not help. Stop the affected request and tell the responsible team.</text><text x="30" y="542" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>No data available</text><text x="30" y="562" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>Walmart documents this as a different condition from failed authentication. Record the outcome.</text><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7600;0.7630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="432" y="424" width="96" height="30" rx="6" fill="none" stroke="#58a6ff" stroke-dasharray="4 4"/><text x="480" y="443" text-anchor="middle" class="sub">Your logo</text><text x="480" y="480" text-anchor="middle" class="pt">We keep the private key. Walmart keeps the registered public key.</text><text x="480" y="500" text-anchor="middle" class="pt">Databricks creates the signature. Walmart verifies it.</text><text x="480" y="520" text-anchor="middle" class="pt">Approved requests return download links. Our pipeline loads the files into Bronze Delta.</text></g></g>
</svg>