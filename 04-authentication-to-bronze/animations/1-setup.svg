<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
<title id="t">Initial setup: key pair and registration with Walmart</title><desc id="d">Subrat creates a matching RSA public and private key pair on an AWS EC2 instance. Only the public key is sent to Walmart. Walmart approves the request and returns a Consumer ID and a key version. The private key stays inside the company boundary.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="580" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="552" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Part 1: Initial setup</text>
<text x="30" y="84" class="s">done once, not repeated for every API request</text>
<rect x="30" y="112" width="540" height="296" rx="14" class="zone"/><text x="46" y="134" class="col">OUR COMPANY (PRIVATE BOUNDARY)</text>
<rect x="640" y="112" width="290" height="296" rx="14" class="zone"/><text x="656" y="134" class="col">WALMART</text>
<circle cx="86" cy="234" r="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><path d="M70,256 q16,-20 32,0" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="86" y="288" text-anchor="middle" class="pt">Subrat</text><text x="86" y="303" text-anchor="middle" class="sub">technical team</text>
<path class="flow" d="M126,250 H172"/>
<rect x="172" y="200" width="170" height="100" rx="10" class="pill"/><text x="257" y="238" text-anchor="middle" class="pt">AWS EC2 instance</text><text x="257" y="254" text-anchor="middle" class="sub">creates the key pair</text>
<text x="412" y="196" class="sub">Public key</text><text x="412" y="286" class="sub">Private key</text>
<path d="M500,222 V312" stroke="#30363d" stroke-dasharray="3 4" fill="none"/><text x="510" y="271" class="sub">matching</text><text x="510" y="285" class="sub">pair</text>
<rect x="190" y="346" width="360" height="52" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/><text x="204" y="361" class="sub">SAVED IN OUR SETUP</text>
<rect x="660" y="160" width="250" height="64" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/><text x="785" y="196" text-anchor="middle" class="sub">onboarding: access request</text>
<rect x="660" y="236" width="250" height="30" rx="8" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<line x1="30" y1="508" x2="930" y2="508" stroke="#1c2128"/>
<text x="30" y="532" class="note">Placeholder values only. No real private key, live signature or usable download URL is ever shown.</text>
<text x="30" y="550" class="note">Based on the onboarding steps in my notes, not checked against Walmart's API reference.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.5000;0.5030;1" values="0;0;1;1;0;0"/><rect x="172" y="200" width="170" height="100" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="257" y="238" text-anchor="middle" class="pt">AWS EC2 instance</text><text x="257" y="254" text-anchor="middle" class="sub">creates the key pair</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.1200;0.1230;1" values="0;0;1;1;0;0"/><animateMotion dur="26s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0200;0.1200;1" calcMode="linear" path="M126,250 H172"/></circle><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.1400;0.1430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><g transform="translate(412,222)"><use href="#kpub"/></g><g transform="translate(412,312)"><use href="#kpriv"/></g><path d="M500,222 V312" stroke="#8b949e" stroke-dasharray="3 4" fill="none"/><text x="510" y="271" class="sub" style="fill:#c9d1d9">matching</text><text x="510" y="285" class="sub" style="fill:#c9d1d9">pair</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.2000;0.2030;0.5000;0.5030;1" values="0;0;1;1;0;0"/><text x="30" y="436" class="note">API-signing key pair (RSA), not a login through SSH.</text></g><text x="30" y="462" class="pt" opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.4980;0.5010;1" values="0;0;1;1;0;0"/>1. Generate the key pair</text><text x="30" y="482" class="body" opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.4980;0.5010;1" values="0;0;1;1;0;0"/>Subrat creates a matching public and private key pair on an AWS EC2 instance. This is initial setup and is not repeated for every API request.</text><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5200;0.5230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="412" y="170" class="grn">public key goes to Walmart</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.6800;0.6830;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="660" y="160" width="250" height="64" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="806" y="188" text-anchor="middle" class="pt">Public key received</text><text x="806" y="205" text-anchor="middle" class="sub" style="fill:#c9d1d9">registered for our account</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5200;0.5230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><g transform="translate(420,336)"><use href="#lock"/></g><text x="434" y="340" class="amb">stays in our company</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5200;0.5230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><g transform="translate(412,222)"><use href="#kpub"/></g><animateMotion dur="26s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5200;0.6800;1" calcMode="linear" path="M0,0 L270,-37" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.7400;0.7430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="660" y="236" width="250" height="30" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="785" y="256" text-anchor="middle" class="grn">Access request approved</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9000;0.9030;1" values="0;0;1;1;0;0"/><rect x="660" y="288" width="104" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="712" y="308" text-anchor="middle" class="hdr">Consumer ID</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9000;0.9030;1" values="0;0;1;1;0;0"/><rect x="776" y="288" width="104" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="828" y="308" text-anchor="middle" class="hdr">Key Version</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9000;0.9030;1" values="0;0;1;1;0;0"/><rect x="660" y="288" width="104" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="712" y="308" text-anchor="middle" class="hdr">Consumer ID</text><animateMotion dur="26s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8000;0.9000;1" calcMode="linear" path="M0,0 L-330,84" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9000;0.9030;1" values="0;0;1;1;0;0"/><rect x="776" y="288" width="104" height="30" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="828" y="308" text-anchor="middle" class="hdr">Key Version</text><animateMotion dur="26s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8000;0.9000;1" calcMode="linear" path="M0,0 L-330,84" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.9000;0.9030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="330" y="372" width="104" height="22" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="382" y="387" text-anchor="middle" class="hdr">Consumer ID</text><rect x="446" y="372" width="94" height="22" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="493" y="387" text-anchor="middle" class="hdr">Key Version</text><rect x="204" y="372" width="112" height="22" rx="7" fill="#0f2a1a" stroke="#d29922" stroke-width="1.5"/><text x="260" y="387" text-anchor="middle" class="amb">private key</text></g><text x="30" y="462" class="pt" opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>2. Register with Walmart</text><text x="30" y="482" class="body" opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Only the public key is sent. After approval Walmart returns a Consumer ID and a key version. The private key never leaves our company.</text></g>
</svg>