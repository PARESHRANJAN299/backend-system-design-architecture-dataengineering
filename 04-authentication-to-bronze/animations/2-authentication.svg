<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d">
<title id="t">Authentication during a pipeline run</title><desc id="d">A scheduled Databricks job passes a permission check to read the private key from a restricted Volume, generates a fresh signature and timestamp, sends the request with four authentication fields, and Walmart verifies the signature with the registered public key. The private key never leaves Databricks.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="650" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="622" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Part 2: Authentication during a pipeline run</text>
<text x="30" y="84" class="s">every run signs a fresh request, the private key is never sent</text>
<rect x="30" y="112" width="570" height="392" rx="14" class="zone"/><text x="46" y="134" class="col">DATABRICKS (OUR COMPANY)</text>
<rect x="650" y="112" width="280" height="392" rx="14" class="zone"/><text x="666" y="134" class="col">WALMART</text>
<rect x="50" y="150" width="180" height="56" rx="10" class="pill"/><text x="140" y="174" text-anchor="middle" class="pt">Scheduled job</text><text x="140" y="190" text-anchor="middle" class="sub">execution identity</text>
<path class="flow" d="M140,206 V300"/>
<rect x="70" y="238" width="140" height="28" rx="14" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="140" y="257" text-anchor="middle" class="amb">READ VOLUME check</text>
<rect x="50" y="300" width="180" height="92" rx="10" class="pill"/>
<g transform="translate(70,326)"><use href="#lock"/></g><text x="86" y="330" class="pt">Restricted Volume</text><text x="62" y="354" class="sub">private key file</text><g transform="translate(150,374) scale(0.7)"><use href="#kpriv"/></g>
<rect x="310" y="176" width="270" height="160" rx="10" class="pill"/>
<text x="445" y="266" text-anchor="middle" class="pt">Signature Generator</text>
<rect x="318" y="190" width="76" height="22" rx="7" fill="none" stroke="#30363d"/><text x="356" y="205" text-anchor="middle" class="sub">Private key</text>
<rect x="398" y="190" width="76" height="22" rx="7" fill="none" stroke="#30363d"/><text x="436" y="205" text-anchor="middle" class="sub">Consumer ID</text>
<rect x="478" y="190" width="76" height="22" rx="7" fill="none" stroke="#30363d"/><text x="516" y="205" text-anchor="middle" class="sub">Key version</text>
<rect x="344" y="290" width="202" height="26" rx="8" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
<rect x="310" y="372" width="270" height="124" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/><text x="324" y="392" class="sub">REQUEST</text>
<rect x="666" y="152" width="248" height="36" rx="8" class="pill"/><circle cx="686" cy="170" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="704" y="174" class="sub">Registered identity and key version</text>
<rect x="666" y="196" width="248" height="36" rx="8" class="pill"/><circle cx="686" cy="214" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="704" y="218" class="sub">Signature verified with public key</text>
<rect x="666" y="240" width="248" height="36" rx="8" class="pill"/><circle cx="686" cy="258" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="704" y="262" class="sub">Signature timestamp still valid</text>
<rect x="666" y="284" width="248" height="36" rx="8" class="pill"/><circle cx="686" cy="302" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="704" y="306" class="sub">Access permitted for this feed</text>
<rect x="666" y="336" width="248" height="46" rx="8" fill="none" stroke="#30363d" stroke-dasharray="4 5"/><text x="680" y="354" class="sub">registered public key</text><g transform="translate(690,370) scale(0.7)"><use href="#kpub"/></g>
<rect x="666" y="394" width="248" height="52" rx="8" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<line x1="30" y1="578" x2="930" y2="578" stroke="#1c2128"/>
<text x="30" y="602" class="note">Placeholder values only. No real private key, live signature or usable download URL is ever shown.</text>
<text x="30" y="620" class="note">Header names and the 3-minute validity are from my notes on Walmart's documentation, not checked against the API reference.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.0100;0.0130;0.2500;0.2530;1" values="0;0;1;1;0;0"/><rect x="50" y="150" width="180" height="56" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="140" y="174" text-anchor="middle" class="pt">Scheduled job</text><text x="140" y="190" text-anchor="middle" class="sub" style="fill:#c9d1d9">execution identity</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.0600;0.0630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="70" y="238" width="140" height="28" rx="14" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="140" y="257" text-anchor="middle" class="grn">READ VOLUME check</text></g><circle r="5" fill="#d29922" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.1000;0.1030;0.2200;0.2230;1" values="0;0;1;1;0;0"/><animateMotion dur="52s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1000;0.2200;1" calcMode="linear" path="M140,300 V206"/></circle><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.1000;0.1030;0.2500;0.2530;1" values="0;0;1;1;0;0"/><text x="148" y="228" class="amb">key read</text></g><text x="30" y="532" class="pt" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2480;0.2510;1" values="0;0;1;1;0;0"/>3. Databricks accesses the private key</text><text x="30" y="552" class="body" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2480;0.2510;1" values="0;0;1;1;0;0"/>The job's identity needs permission on the Volume's catalog and schema plus READ VOLUME. Only then does the code read the key. This check is separate from Walmart authentication.</text><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.2700;0.2730;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="318" y="190" width="76" height="22" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="356" y="205" text-anchor="middle" class="hdr">Private key</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.3100;0.3130;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="398" y="190" width="76" height="22" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="436" y="205" text-anchor="middle" class="hdr">Consumer ID</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.3500;0.3530;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="478" y="190" width="76" height="22" rx="7" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="516" y="205" text-anchor="middle" class="hdr">Key version</text></g><circle r="5" fill="#d29922" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.2700;0.2730;0.3300;0.3330;1" values="0;0;1;1;0;0"/><animateMotion dur="52s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2700;0.3300;1" calcMode="linear" path="M230,178 C270,178 280,201 318,201"/></circle><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.4000;0.4030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><path d="M445,216 V248" stroke="#58a6ff" stroke-width="2" fill="none"/><path d="M439,242 L445,250 L451,242" fill="none" stroke="#58a6ff" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.4200;0.4230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="344" y="290" width="202" height="26" rx="8" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><text x="445" y="308" text-anchor="middle" class="hdr">Signature + Timestamp</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.4500;0.4530;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="356" y="344" width="178" height="22" rx="11" fill="none" stroke="#d29922" stroke-width="1.5"/><text x="445" y="359" text-anchor="middle" class="amb">valid for 3 minutes</text></g><text x="30" y="532" class="pt" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.2520;0.2550;0.4980;0.5010;1" values="0;0;1;1;0;0"/>4. Generate a fresh signature</text><text x="30" y="552" class="body" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.2520;0.2550;0.4980;0.5010;1" values="0;0;1;1;0;0"/>Private key, Consumer ID and key version go in; a signature and timestamp come out. The 3 minutes apply to the signature only. Generate it, then send it immediately.</text><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.5000;0.5030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="310" y="372" width="270" height="124" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="324" y="392" class="pt">Request: latest Store Sales feed</text><text x="324" y="414" class="hdr">WM_CONSUMER.ID</text><text x="324" y="432" class="hdr">WM_SEC.KEY_VERSION</text><text x="324" y="450" class="hdr">WM_CONSUMER.INTIMESTAMP</text><text x="324" y="468" class="hdr">WM_SEC.AUTH_SIGNATURE</text><text x="324" y="486" class="sub">(placeholder values)</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.5000;0.5030;0.7500;0.7530;1" values="0;0;1;1;0;0"/><g transform="translate(120,424)"><use href="#lock"/></g><text x="136" y="428" class="amb">private key stays in Databricks</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.6000;0.6030;0.7200;0.7230;1" values="0;0;1;1;0;0"/><g transform="translate(600,438)"><use href="#env"/></g><animateMotion dur="52s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6000;0.7200;1" calcMode="linear" path="M0,0 L90,-4" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.7200;0.7230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="666" y="394" width="248" height="52" rx="8" fill="#0d2238" stroke="#58a6ff" stroke-width="1.5"/><g transform="translate(694,420) scale(0.8)"><use href="#env"/></g><text x="726" y="416" class="pt">Request received</text><text x="726" y="434" class="sub" style="fill:#c9d1d9">4 auth fields + feed request</text></g><text x="30" y="532" class="pt" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>5. Send the authenticated request</text><text x="30" y="552" class="body" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>Only the request envelope crosses to Walmart: Consumer ID, key version, timestamp and signature. The private-key file is never sent.</text><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.7600;0.7630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="666" y="152" width="248" height="36" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="686" cy="170" r="8" fill="#3fb950"/><path d="M682,170 l3,3 l6,-7" fill="none" stroke="#0d1117" stroke-width="2"/><text x="704" y="174" class="hdr">Registered identity and key version</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.8050;0.8080;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="666" y="196" width="248" height="36" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="686" cy="214" r="8" fill="#3fb950"/><path d="M682,214 l3,3 l6,-7" fill="none" stroke="#0d1117" stroke-width="2"/><text x="704" y="218" class="hdr">Signature verified with public key</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.8500;0.8530;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="666" y="240" width="248" height="36" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="686" cy="258" r="8" fill="#3fb950"/><path d="M682,258 l3,3 l6,-7" fill="none" stroke="#0d1117" stroke-width="2"/><text x="704" y="262" class="hdr">Signature timestamp still valid</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.8950;0.8980;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="666" y="284" width="248" height="36" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><circle cx="686" cy="302" r="8" fill="#3fb950"/><path d="M682,302 l3,3 l6,-7" fill="none" stroke="#0d1117" stroke-width="2"/><text x="704" y="306" class="hdr">Access permitted for this feed</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.7600;0.7630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="666" y="336" width="248" height="46" rx="8" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="680" y="354" class="hdr">registered public key</text><g transform="translate(690,370) scale(0.7)"><use href="#kpub"/></g><text x="730" y="374" class="sub" style="fill:#c9d1d9">verifies the signature</text></g><g opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.9300;0.9330;0.9950;0.9980;1" values="0;0;1;1;0;0"/><text x="790" y="470" text-anchor="middle" class="grn">Authentication successful</text><text x="790" y="488" text-anchor="middle" class="grn">Access checks passed</text></g><text x="30" y="532" class="pt" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.7520;0.7550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>6. Walmart verifies the request</text><text x="30" y="552" class="body" opacity="0"><animate attributeName="opacity" dur="52s" repeatCount="indefinite" keyTimes="0;0.7520;0.7550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Walmart uses our registered public key to verify the signature, and checks the identity, the timestamp and the access to the requested feed. It never receives or compares our private key.</text></g>
</svg>