<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="t d">
<title id="t">Receive download links, land files, write Bronze Delta</title><desc id="d">After authentication succeeds, Walmart returns download links. The Databricks job downloads the data files, saves them to a landing location separate from the private-key Volume, Auto Loader reads them with a checkpoint, and writes Bronze Delta. The team reads the stored data.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="570" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="542" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Part 3: Receive and process the data</text>
<text x="30" y="84" class="s">links first, then files, then Bronze Delta</text>
<text x="30" y="116" class="col">WALMART</text><text x="230" y="116" class="col">DATABRICKS JOB</text><text x="420" y="116" class="col">PROPOSED: LANDING</text><text x="610" y="116" class="col">PROPOSED: AUTO LOADER</text><text x="800" y="116" class="col">BRONZE</text>
<rect x="30" y="130" width="150" height="50" rx="10" class="pill"/><text x="105" y="152" text-anchor="middle" class="pt">API</text><text x="105" y="168" text-anchor="middle" class="sub">returns links</text>
<rect x="30" y="196" width="150" height="62" rx="10" class="pill"/><text x="105" y="222" text-anchor="middle" class="pt">Signed-URL storage</text><text x="105" y="238" text-anchor="middle" class="sub">holds the data files</text>
<rect x="230" y="130" width="140" height="128" rx="10" class="pill"/><text x="300" y="190" text-anchor="middle" class="pt">Job</text><text x="300" y="206" text-anchor="middle" class="sub">uses the links</text>
<rect x="420" y="130" width="140" height="128" rx="10" class="pill"/><text x="490" y="190" text-anchor="middle" class="pt">Landing location</text><text x="490" y="206" text-anchor="middle" class="sub">S3 or landing Volume</text>
<rect x="610" y="130" width="140" height="128" rx="10" class="pill"/><text x="680" y="190" text-anchor="middle" class="pt">Auto Loader</text><text x="680" y="206" text-anchor="middle" class="sub">reads new files</text>
<rect x="800" y="130" width="130" height="128" rx="10" class="pill"/><text x="865" y="190" text-anchor="middle" class="pt">Bronze Delta</text><text x="865" y="206" text-anchor="middle" class="sub">table</text>
<path class="flow" d="M180,155 H230"/>
<path class="flow" d="M230,227 H180"/>
<path class="flow" d="M370,194 H420"/>
<path class="flow" d="M560,194 H610"/>
<path class="flow" d="M750,194 H800"/>
<rect x="610" y="300" width="140" height="56" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/><text x="680" y="324" text-anchor="middle" class="pt" style="fill:#8b949e">Checkpoint</text><text x="680" y="340" text-anchor="middle" class="sub">ingestion progress</text>
<path class="flow" d="M680,258 V300" stroke-dasharray="3 4"/>
<rect x="420" y="300" width="140" height="56" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/><g transform="translate(436,322)"><use href="#lock"/></g><text x="452" y="326" class="sub">private-key Volume</text><text x="436" y="344" class="sub">separate, never landing</text>
<rect x="800" y="300" width="130" height="76" rx="10" class="pill"/><text x="865" y="334" text-anchor="middle" class="pt">Team</text><text x="865" y="350" text-anchor="middle" class="sub">reads stored data</text>
<path class="flow" d="M865,258 V300"/>
<line x1="30" y1="498" x2="930" y2="498" stroke="#1c2128"/>
<text x="30" y="522" class="note">Placeholder values only. No real private key, live signature or usable download URL is ever shown.</text>
<text x="30" y="540" class="note">The landing location and Auto Loader steps are a proposed flow, still to be confirmed against the existing notebooks.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.0100;0.0130;0.3600;0.3630;1" values="0;0;1;1;0;0"/><rect x="30" y="130" width="150" height="50" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="105" y="152" text-anchor="middle" class="pt">API</text><text x="105" y="168" text-anchor="middle" class="sub" style="fill:#c9d1d9">returns links</text></g><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.0400;0.0430;0.1400;0.1430;1" values="0;0;1;1;0;0"/><g transform="translate(180,155)"><use href="#lnk"/></g><g transform="translate(180,155)"><use href="#lnk"/></g><animateMotion dur="48s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0400;0.1200;1" calcMode="linear" path="M0,0 L50,0" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.1200;0.1230;0.3600;0.3630;1" values="0;0;1;1;0;0"/><rect x="230" y="130" width="140" height="128" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="300" y="190" text-anchor="middle" class="pt">Job</text><text x="300" y="206" text-anchor="middle" class="sub" style="fill:#c9d1d9">uses the links</text><g transform="translate(300,236)"><use href="#lnk"/></g></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.1500;0.1530;0.2200;0.2230;1" values="0;0;1;1;0;0"/><animateMotion dur="48s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1500;0.2200;1" calcMode="linear" path="M230,227 H180"/></circle><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.2000;0.2030;0.3600;0.3630;1" values="0;0;1;1;0;0"/><rect x="30" y="196" width="150" height="62" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="105" y="222" text-anchor="middle" class="pt">Signed-URL storage</text><text x="105" y="238" text-anchor="middle" class="sub" style="fill:#c9d1d9">holds the data files</text></g><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.2300;0.2330;0.3300;0.3330;1" values="0;0;1;1;0;0"/><g transform="translate(180,227)"><use href="#fil"/></g><animateMotion dur="48s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2300;0.3100;1" calcMode="linear" path="M0,0 L50,0" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.2200;0.2230;0.3600;0.3630;1" values="0;0;1;1;0;0"/><text x="30" y="290" class="note">download links expire on their own, separate from the 3-minute signature</text></g><text x="30" y="452" class="pt" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.3580;0.3610;1" values="0;0;1;1;0;0"/>7. Receive download links</text><text x="30" y="472" class="body" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.3580;0.3610;1" values="0;0;1;1;0;0"/>Walmart returns links first, not table rows. The job uses those links to download the actual data files.</text><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.3800;0.3830;0.4700;0.4730;1" values="0;0;1;1;0;0"/><animateMotion dur="48s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3800;0.4700;1" calcMode="linear" path="M370,194 H420"/></circle><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.4400;0.4430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="420" y="130" width="140" height="128" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="490" y="190" text-anchor="middle" class="pt">Landing location</text><text x="490" y="206" text-anchor="middle" class="sub" style="fill:#c9d1d9">files saved</text><g transform="translate(490,236)"><use href="#fil"/></g></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.5000;0.5030;0.5800;0.5830;1" values="0;0;1;1;0;0"/><animateMotion dur="48s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.5800;1" calcMode="linear" path="M560,194 H610"/></circle><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.5600;0.5630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="610" y="130" width="140" height="128" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="680" y="190" text-anchor="middle" class="pt">Auto Loader</text><text x="680" y="206" text-anchor="middle" class="sub" style="fill:#c9d1d9">reads the files</text></g><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.6000;0.6030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="610" y="300" width="140" height="56" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="680" y="324" text-anchor="middle" class="pt">Checkpoint</text><text x="680" y="340" text-anchor="middle" class="sub" style="fill:#c9d1d9">progress recorded</text></g><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.6300;0.6330;0.7000;0.7030;1" values="0;0;1;1;0;0"/><animateMotion dur="48s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6300;0.7000;1" calcMode="linear" path="M750,194 H800"/></circle><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.6800;0.6830;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="800" y="130" width="130" height="128" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="865" y="190" text-anchor="middle" class="pt">Bronze Delta</text><text x="865" y="206" text-anchor="middle" class="sub" style="fill:#c9d1d9">data written</text></g><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.7200;0.7230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="760" y="268" width="170" height="24" rx="12" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="845" y="284" text-anchor="middle" class="grn">Bronze load completed</text></g><text x="30" y="452" class="pt" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.3620;0.3650;0.7980;0.8010;1" values="0;0;1;1;0;0"/>8. Land the files and write Bronze (proposed)</text><text x="30" y="472" class="body" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.3620;0.3650;0.7980;0.8010;1" values="0;0;1;1;0;0"/>The job saves files to a landing location, separate from the private-key Volume. Auto Loader reads them and writes Bronze Delta. Its checkpoint records progress so it can resume after an interruption.</text><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.8200;0.8230;0.9000;0.9030;1" values="0;0;1;1;0;0"/><animateMotion dur="48s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8200;0.9000;1" calcMode="linear" path="M865,300 V258"/></circle><g opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="800" y="300" width="130" height="76" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="865" y="334" text-anchor="middle" class="pt">Team</text><text x="865" y="350" text-anchor="middle" class="sub" style="fill:#c9d1d9">reads stored data</text></g><text x="30" y="452" class="pt" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.8020;0.8050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>After the initial load</text><text x="30" y="472" class="body" opacity="0"><animate attributeName="opacity" dur="48s" repeatCount="indefinite" keyTimes="0;0.8020;0.8050;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Scheduled runs collect new or missed deliveries. The team uses our stored tables instead of downloading the same data again for each business request.</text></g>
</svg>