<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 928" width="960" height="928" role="img" aria-labelledby="t d">
  <title id="t">Connections, live flow and rules</title>
  <desc id="d">For each connection in the pipeline: the protocol, the security controls, the rules that govern it and how often data flows. Numbers match the badges on the architecture diagram, except 8, the developer path.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .zlab{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e;letter-spacing:2px}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .num{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#58a6ff}
      .tag{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950} .cl{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px}
      .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .flow{fill:none;stroke:#3d444d;stroke-width:2}
      .run{fill:none;stroke:#58a6ff;stroke-width:2;stroke-dasharray:5 7;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      @media (prefers-reduced-motion:reduce){.run{animation:none}}
    </style>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect class="bg" width="960" height="928" rx="18"/>
  <rect class="card" x="14" y="14" width="932" height="900" rx="14"/>
  <text x="30" y="52" class="h">Connections, live flow and rules</text>
  <text x="30" y="74" class="s">badges 1 to 7 and 9 appear on the architecture diagram; 8 is the developer path</text>
  <line x1="30" y1="176" x2="930" y2="176" stroke="#1c2128"/><circle cx="40" cy="126" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="130" text-anchor="middle" class="num">1</text><rect x="64" y="106" width="116" height="40" rx="9" class="pill"/><text x="122" y="130" text-anchor="middle" class="pt">Coinbase</text><rect x="238" y="106" width="116" height="40" rx="9" class="pill"/><text x="296" y="130" text-anchor="middle" class="pt">EC2 consumer</text><path class="flow" d="M180,126 H238"/><path class="run" d="M180,126 H238"/><text x="209" y="160" text-anchor="middle" class="tag">● live · every update</text><text x="380" y="112" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="130" class="body">WebSocket over TLS (wss)</text><text x="380" y="145" class="body">Advanced Trade ticker,</text><text x="380" y="160" class="body">subscribed to BTC-USD</text><text x="560" y="112" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="130" class="body">Outbound connection only</text><text x="560" y="145" class="body">No inbound ports opened,</text><text x="560" y="160" class="body">no security-group changes</text><text x="760" y="112" class="cl" style="fill:#d29922">RULES</text><text x="760" y="130" class="body">Ping every 20 s, 10 s timeout</text><text x="760" y="145" class="body">Reconnect backoff 1 s to 60 s</text><text x="760" y="160" class="body">Resets after 60 s stable</text><circle r="4" fill="#58a6ff" filter="url(#glow)"><animateMotion dur="1.2s" begin="0.0s" repeatCount="indefinite" path="M180,126 H238"/></circle><circle r="4" fill="#58a6ff" filter="url(#glow)"><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite" path="M180,126 H238"/></circle><circle r="4" fill="#58a6ff" filter="url(#glow)"><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite" path="M180,126 H238"/></circle><line x1="30" y1="260" x2="930" y2="260" stroke="#1c2128"/><circle cx="40" cy="210" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="214" text-anchor="middle" class="num">2</text><rect x="64" y="190" width="116" height="40" rx="9" class="pill"/><text x="122" y="214" text-anchor="middle" class="pt">EC2 consumer</text><rect x="238" y="190" width="116" height="40" rx="9" class="pill"/><text x="296" y="214" text-anchor="middle" class="pt">Amazon S3</text><path class="flow" d="M180,210 H238"/><path class="run" d="M180,210 H238"/><text x="209" y="244" text-anchor="middle" class="tag">● one file per 15 s or more</text><text x="380" y="196" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="214" class="body">HTTPS, S3 PutObject via</text><text x="380" y="229" class="body">boto3, partitioned by hour</text><text x="380" y="244" class="body">(YYYY/MM/DD/HH)</text><text x="560" y="196" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="214" class="body">EC2 IAM role, temporary STS</text><text x="560" y="229" class="body">credentials, no access keys</text><text x="560" y="244" class="body">Least privilege: coinbase/raw/*</text><text x="760" y="196" class="cl" style="fill:#d29922">RULES</text><text x="760" y="214" class="body">Up to 5 attempts with backoff</text><text x="760" y="229" class="body">Spool to disk if S3 is down,</text><text x="760" y="244" class="body">replay after the next success</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.88;0.882;0.97;0.972;1" dur="15s" repeatCount="indefinite"/><rect x="-13" y="-9" width="26" height="18" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><text x="0" y="4" text-anchor="middle" style="font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950">{ }</text><animateMotion dur="15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.88;0.97;1" path="M180,210 H238"/></g></g><line x1="30" y1="344" x2="930" y2="344" stroke="#1c2128"/><circle cx="40" cy="294" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="298" text-anchor="middle" class="num">3</text><rect x="64" y="274" width="116" height="40" rx="9" class="pill"/><text x="122" y="298" text-anchor="middle" class="pt">Amazon S3</text><rect x="238" y="274" width="116" height="40" rx="9" class="pill"/><text x="296" y="298" text-anchor="middle" class="pt">Databricks</text><path class="flow" d="M180,294 H238"/><path class="run" d="M180,294 H238"/><text x="209" y="328" text-anchor="middle" class="tag">● read on each pipeline run</text><text x="380" y="280" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="298" class="body">S3 API over HTTPS through a</text><text x="380" y="313" class="body">Unity Catalog External</text><text x="380" y="328" class="body">Location (directory listing)</text><text x="560" y="280" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="298" class="body">Storage Credential assumes a</text><text x="560" y="313" class="body">separate read-only AWS role</text><text x="560" y="328" class="body">(external ID), SSE-S3 at rest</text><text x="760" y="280" class="cl" style="fill:#d29922">RULES</text><text x="760" y="298" class="body">Read-only access to the</text><text x="760" y="313" class="body">coinbase/raw/ path, separate</text><text x="760" y="328" class="body">from the EC2 write role</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.10200000000000001;0.4;0.402;1" dur="3.2s" repeatCount="indefinite"/><circle r="4" fill="#58a6ff"/><animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.4;1" path="M180,294 H238"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.602;0.9;0.902;1" dur="3.2s" repeatCount="indefinite"/><circle r="4" fill="#58a6ff"/><animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.9;1" path="M180,294 H238"/></g></g><line x1="30" y1="428" x2="930" y2="428" stroke="#1c2128"/><circle cx="40" cy="378" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="382" text-anchor="middle" class="num">4</text><rect x="64" y="358" width="116" height="40" rx="9" class="pill"/><text x="122" y="382" text-anchor="middle" class="pt">Auto Loader</text><rect x="238" y="358" width="116" height="40" rx="9" class="pill"/><text x="296" y="382" text-anchor="middle" class="pt">Bronze</text><path class="flow" d="M180,378 H238"/><path class="run" d="M180,378 H238"/><text x="209" y="412" text-anchor="middle" class="tag">● incremental, every 15 min</text><text x="380" y="364" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="382" class="body">Auto Loader (cloudFiles), JSON</text><text x="380" y="397" class="body">in a serverless Lakeflow</text><text x="380" y="412" class="body">pipeline</text><text x="560" y="364" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="382" class="body">Tables governed by</text><text x="560" y="397" class="body">Unity Catalog</text><text x="760" y="364" class="cl" style="fill:#d29922">RULES</text><text x="760" y="382" class="body">Checkpoint tracks processed files,</text><text x="760" y="397" class="body">so re-runs add no duplicates</text><text x="760" y="412" class="body">Adds source file and ingest time</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.10200000000000001;0.4;0.402;1" dur="3.2s" repeatCount="indefinite"/><circle r="4" fill="#58a6ff"/><animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.4;1" path="M180,378 H238"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.602;0.9;0.902;1" dur="3.2s" repeatCount="indefinite"/><circle r="4" fill="#58a6ff"/><animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.9;1" path="M180,378 H238"/></g></g><line x1="30" y1="512" x2="930" y2="512" stroke="#1c2128"/><circle cx="40" cy="462" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="466" text-anchor="middle" class="num">5</text><rect x="64" y="442" width="116" height="40" rx="9" class="pill"/><text x="122" y="466" text-anchor="middle" class="pt">Bronze</text><rect x="238" y="442" width="116" height="40" rx="9" class="pill"/><text x="296" y="466" text-anchor="middle" class="pt">Silver</text><path class="flow" d="M180,462 H238"/><path class="run" d="M180,462 H238"/><text x="209" y="496" text-anchor="middle" class="tag">● new rows only</text><text x="380" y="448" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="466" class="body">Streaming read of the Bronze</text><text x="380" y="481" class="body">table inside the same</text><text x="380" y="496" class="body">pipeline</text><text x="560" y="448" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="466" class="body">Unity Catalog governs both</text><text x="560" y="481" class="body">tables (bronze and silver</text><text x="560" y="496" class="body">schemas)</text><text x="760" y="448" class="cl" style="fill:#d29922">RULES</text><text x="760" y="466" class="body">4 quality rules drop bad rows</text><text x="760" y="481" class="body">Deduplicate on product, time</text><text x="760" y="496" class="body">and sequence number</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.10200000000000001;0.4;0.402;1" dur="3.2s" repeatCount="indefinite"/><circle r="4" fill="#58a6ff"/><animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.4;1" path="M180,462 H238"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.602;0.9;0.902;1" dur="3.2s" repeatCount="indefinite"/><circle r="4" fill="#58a6ff"/><animateMotion dur="3.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.9;1" path="M180,462 H238"/></g></g><text x="30" y="538" class="zlab">OPERATIONS AND DELIVERY</text><line x1="30" y1="632" x2="930" y2="632" stroke="#1c2128"/><circle cx="40" cy="582" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="586" text-anchor="middle" class="num">6</text><rect x="64" y="562" width="116" height="40" rx="9" class="pill"/><text x="122" y="586" text-anchor="middle" class="pt">Job</text><rect x="238" y="562" width="116" height="40" rx="9" class="pill"/><text x="296" y="586" text-anchor="middle" class="pt">Pipeline</text><path class="flow" d="M180,582 H238"/><path class="run" d="M180,582 H238"/><text x="209" y="616" text-anchor="middle" class="tag">● every 15 min, UTC</text><text x="380" y="568" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="586" class="body">Databricks Job runs the</text><text x="380" y="601" class="body">pipeline task on a cron</text><text x="380" y="616" class="body">schedule</text><text x="560" y="568" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="586" class="body">Defined as code in the Asset</text><text x="560" y="601" class="body">Bundle and deployed through</text><text x="560" y="616" class="body">the CLI, not by hand</text><text x="760" y="568" class="cl" style="fill:#d29922">RULES</text><text x="760" y="586" class="body">One run at a time</text><text x="760" y="601" class="body">3 retries, 60 s apart</text><text x="760" y="616" class="body">Email on failure</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.10200000000000001;0.3;0.302;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#a371f7"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.3;1" path="M180,582 H238"/></g></g><line x1="30" y1="716" x2="930" y2="716" stroke="#1c2128"/><circle cx="40" cy="666" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="670" text-anchor="middle" class="num">7</text><rect x="64" y="646" width="116" height="40" rx="9" class="pill"/><text x="122" y="670" text-anchor="middle" class="pt">Health check</text><rect x="238" y="646" width="116" height="40" rx="9" class="pill"/><text x="296" y="670" text-anchor="middle" class="pt">Amazon S3</text><path class="flow" d="M180,666 H238"/><path class="run" d="M180,666 H238"/><text x="209" y="700" text-anchor="middle" class="tag">● every 15 min</text><text x="380" y="652" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="670" class="body">Databricks job reads the raw</text><text x="380" y="685" class="body">S3 prefix directly, not</text><text x="380" y="700" class="body">through Bronze</text><text x="560" y="652" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="670" class="body">Same governed read access</text><text x="560" y="685" class="body">as the pipeline (External</text><text x="560" y="700" class="body">Location)</text><text x="760" y="652" class="cl" style="fill:#d29922">RULES</text><text x="760" y="670" class="body">Fails if the newest file is</text><text x="760" y="685" class="body">older than 10 minutes, which</text><text x="760" y="700" class="body">emails an alert</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.10200000000000001;0.3;0.302;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#a371f7"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.3;1" path="M180,666 H238"/></g></g><line x1="30" y1="800" x2="930" y2="800" stroke="#1c2128"/><circle cx="40" cy="750" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="754" text-anchor="middle" class="num">8</text><rect x="64" y="730" width="116" height="40" rx="9" class="pill"/><text x="122" y="754" text-anchor="middle" class="pt">Dev laptop</text><rect x="238" y="730" width="116" height="40" rx="9" class="pill"/><text x="296" y="754" text-anchor="middle" class="pt">EC2 dev server</text><path class="flow" d="M180,750 H238"/><path class="run" d="M180,750 H238"/><text x="209" y="784" text-anchor="middle" class="tag">● on demand</text><text x="380" y="736" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="754" class="body">SSH (VS Code Remote SSH)</text><text x="380" y="769" class="body">to the EC2 dev server</text><text x="560" y="736" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="754" class="body">Key-pair authentication</text><text x="560" y="769" class="body">S3 access comes from the</text><text x="560" y="784" class="body">instance role, no stored keys</text><text x="760" y="736" class="cl" style="fill:#d29922">RULES</text><text x="760" y="754" class="body">Work happens on a branch</text><text x="760" y="769" class="body">main is protected: changes</text><text x="760" y="784" class="body">merge only via pull request</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.10200000000000001;0.3;0.302;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#a371f7"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.3;1" path="M180,750 H238"/></g></g><line x1="30" y1="884" x2="930" y2="884" stroke="#1c2128"/><circle cx="40" cy="834" r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><text x="40" y="838" text-anchor="middle" class="num">9</text><rect x="64" y="814" width="116" height="40" rx="9" class="pill"/><text x="122" y="838" text-anchor="middle" class="pt">EC2</text><rect x="238" y="814" width="116" height="40" rx="9" class="pill"/><text x="296" y="838" text-anchor="middle" class="pt">Databricks</text><path class="flow" d="M180,834 H238"/><path class="run" d="M180,834 H238"/><text x="209" y="868" text-anchor="middle" class="tag">● on deploy</text><text x="380" y="820" class="cl" style="fill:#58a6ff">PROTOCOL</text><text x="380" y="838" class="body">Databricks CLI over HTTPS,</text><text x="380" y="853" class="body">bundle deploy to the dev</text><text x="380" y="868" class="body">target</text><text x="560" y="820" class="cl" style="fill:#3fb950">SECURITY</text><text x="560" y="838" class="body">OAuth login from the CLI</text><text x="760" y="820" class="cl" style="fill:#d29922">RULES</text><text x="760" y="838" class="body">Validate before deploy</text><text x="760" y="853" class="body">Pipeline, jobs and schedules</text><text x="760" y="868" class="body">are created from the bundle</text><g filter="url(#glow)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.10200000000000001;0.3;0.302;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#a371f7"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.3;1" path="M180,834 H238"/></g></g>
</svg>
