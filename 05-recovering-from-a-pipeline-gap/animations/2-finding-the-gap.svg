<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
<title id="t">Finding the gap and choosing the recovery</title><desc id="d">Paresh, the senior data engineer, compares the expected delivery dates with the tracking table and finds 5 and 6 October pending. He then checks where the failure happened: files that never reached the landing location need a request to Walmart by feed date, while files already landed only need Auto Loader to resume from its checkpoint.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="620" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="592" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">Finding the gap</text>
<text x="30" y="84" class="s">the senior data engineer compares expected dates with what actually loaded</text>
<circle cx="90" cy="242" r="9" fill="none" stroke="#8b949e" stroke-width="1.5"/><path d="M74,264 q16,-20 32,0" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="90" y="296" text-anchor="middle" class="pt">Paresh</text><text x="90" y="311" text-anchor="middle" class="sub">Senior Data Engineer</text>
<path class="flow" d="M150,250 H210"/>
<rect x="210" y="116" width="260" height="214" rx="12" class="pill"/><text x="226" y="140" class="pt">Tracking table</text><text x="226" y="156" class="sub">which deliveries reached Bronze</text>
<rect x="226" y="170" width="228" height="30" rx="7" fill="none" stroke="#30363d"/><text x="240" y="190" class="dim">4 Oct</text>
<text x="440" y="190" text-anchor="end" class="sub">complete</text>
<rect x="226" y="206" width="228" height="30" rx="7" fill="none" stroke="#30363d"/><text x="240" y="226" class="dim">5 Oct</text>
<text x="440" y="226" text-anchor="end" class="sub">pending</text>
<rect x="226" y="242" width="228" height="30" rx="7" fill="none" stroke="#30363d"/><text x="240" y="262" class="dim">6 Oct</text>
<text x="440" y="262" text-anchor="end" class="sub">pending</text>
<rect x="226" y="278" width="228" height="30" rx="7" fill="none" stroke="#30363d"/><text x="240" y="298" class="dim">7 Oct</text>
<text x="440" y="298" text-anchor="end" class="sub">complete</text>
<text x="530" y="136" class="col">WHERE DID THE FAILURE HAPPEN?</text>
<rect x="530" y="148" width="400" height="56" rx="10" class="pill"/><text x="546" y="172" class="pt">Check the landing location</text><text x="546" y="190" class="sub">are the files for 5 and 6 Oct there?</text>
<path class="flow" d="M730,204 V226 M730,226 H650 V244 M730,226 H810 V244"/>
<rect x="530" y="244" width="240" height="96" rx="10" class="pill"/><text x="546" y="268" class="dim">A. Files never arrived</text><text x="546" y="288" class="sub">request the missing feed dates</text><text x="546" y="304" class="sub">from Walmart and download them</text>
<rect x="790" y="244" width="140" height="96" rx="10" class="pill"/><text x="800" y="268" class="dim">B. Files landed</text><text x="800" y="288" class="sub">Bronze failed:</text><text x="800" y="304" class="sub">resume Auto Loader</text><text x="800" y="320" class="sub">from its checkpoint</text>
<rect x="210" y="360" width="350" height="82" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<rect x="580" y="360" width="350" height="82" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 5"/>
<line x1="30" y1="548" x2="930" y2="548" stroke="#1c2128"/>
<text x="30" y="572" class="note">Example scenario with made-up dates. One delivery per day is assumed for illustration.</text>
<text x="30" y="590" class="note">The 45-day retention and the status check come from my notes on Walmart's documentation, not checked against the API reference.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.3000;0.3030;1" values="0;0;1;1;0;0"/><rect x="210" y="116" width="260" height="214" rx="12" fill="none" stroke="#58a6ff" stroke-width="2"/></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.1000;0.1030;1" values="0;0;1;1;0;0"/><animateMotion dur="36s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0200;0.1000;1" calcMode="linear" path="M150,250 H210"/></circle><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0300;0.0330;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="226" y="170" width="228" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="240" y="190" class="pt">4 Oct</text><text x="440" y="190" text-anchor="end" class="grn">complete</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.1200;0.1230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="226" y="206" width="228" height="30" rx="7" fill="#2a2110" stroke="#d29922" stroke-width="2"/><text x="240" y="226" class="pt">5 Oct</text><text x="440" y="226" text-anchor="end" class="amb">pending</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.1700;0.1730;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="226" y="242" width="228" height="30" rx="7" fill="#2a2110" stroke="#d29922" stroke-width="2"/><text x="240" y="262" class="pt">6 Oct</text><text x="440" y="262" text-anchor="end" class="amb">pending</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0300;0.0330;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="226" y="278" width="228" height="30" rx="7" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/><text x="240" y="298" class="pt">7 Oct</text><text x="440" y="298" text-anchor="end" class="grn">complete</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.2000;0.2030;0.3000;0.3030;1" values="0;0;1;1;0;0"/><text x="30" y="352" class="note">Do not trust the maximum date.</text><text x="30" y="368" class="note">Compare expected dates with the table.</text></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2980;0.3010;1" values="0;0;1;1;0;0"/>1. Compare expected dates with what loaded</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2980;0.3010;1" values="0;0;1;1;0;0"/>The tracking table shows 5 and 6 October still pending, even though 7 October is complete. That is the gap.</text><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3000;0.3030;0.3600;0.3630;1" values="0;0;1;1;0;0"/><animateMotion dur="36s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.3000;0.3600;1" calcMode="linear" path="M470,250 C500,250 500,176 530,176"/></circle><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3200;0.3230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="530" y="148" width="400" height="56" rx="10" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="546" y="172" class="pt">Check the landing location</text><text x="546" y="190" class="sub" style="fill:#c9d1d9">are the files for 5 and 6 Oct there?</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.4000;0.4030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="800" y="158" width="120" height="36" rx="18" fill="#2a2110" stroke="#d29922" stroke-width="1.5"/><text x="860" y="181" text-anchor="middle" class="amb">no files found</text></g><circle r="5" fill="#d29922" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.4400;0.4430;0.5000;0.5030;1" values="0;0;1;1;0;0"/><animateMotion dur="36s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4400;0.5000;1" calcMode="linear" path="M730,204 V226 H650 V244"/></circle><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.5000;0.5030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="530" y="244" width="240" height="96" rx="10" fill="#2a2110" stroke="#d29922" stroke-width="2.5"/><text x="546" y="268" class="pt">A. Files never arrived</text><text x="546" y="288" class="sub" style="fill:#c9d1d9">request the missing feed dates</text><text x="546" y="304" class="sub" style="fill:#c9d1d9">from Walmart and download them</text><text x="546" y="326" class="amb">chosen: this case</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.5000;0.5030;0.6500;0.6530;1" values="0;0;1;1;0;0"/><text x="790" y="360" class="sub">B applies only if the files</text><text x="790" y="374" class="sub">were already in landing</text></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3020;0.3050;0.6480;0.6510;1" values="0;0;1;1;0;0"/>2. Find where the failure happened</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.3020;0.3050;0.6480;0.6510;1" values="0;0;1;1;0;0"/>The pipeline was stopped, so the files for 5 and 6 October never reached the landing location. They must be requested again from Walmart.</text><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.6700;0.6730;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="210" y="360" width="350" height="82" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="226" y="384" class="pt">Keep the original landed files</text><text x="226" y="404" class="sub">Auto Loader tracks files by path.</text><text x="226" y="420" class="sub">A copy under a new name can be</text><text x="226" y="434" class="sub">ingested a second time.</text></g><g opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="580" y="360" width="350" height="82" rx="10" fill="#11161d" stroke="#58a6ff" stroke-width="1.5"/><text x="596" y="384" class="pt">Check availability first</text><text x="596" y="404" class="sub">Walmart keeps incremental files for up</text><text x="596" y="420" class="sub">to 45 days. A 2-day gap is inside that,</text><text x="596" y="434" class="sub">but availability is still checked.</text></g><text x="30" y="502" class="pt" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.6520;0.6550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>3. Recover safely</text><text x="30" y="522" class="body" opacity="0"><animate attributeName="opacity" dur="36s" repeatCount="indefinite" keyTimes="0;0.6520;0.6550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Reuse the original landed files and the checkpoint where files exist, and check Walmart's availability before requesting a date.</text></g>
</svg>