<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">What went wrong: a two-day gap</title><desc id="d">A daily pipeline loads Store Sales deliveries into Bronze. It stops on 5 and 6 October without anyone noticing, restarts on 7 October and loads only the latest delivery, so 5 and 6 October are missing from Bronze while the latest date looks fine.</desc>
<defs><style>
      .bg{fill:#0d1117} .card{fill:#11161d;stroke:#30363d} .pill{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zone{fill:none;stroke:#30363d;stroke-width:1.5;stroke-dasharray:6 6}
      .h{font:700 20px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .s{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .pt{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .dim{font:700 12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#aab4c0}
      .col{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#58a6ff;letter-spacing:1.5px}
      .note{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922}
      .amb{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#d29922} .grn{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3fb950}
      .hdr{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
      .flow{fill:none;stroke:#2d333b;stroke-width:1.5}
      @media (prefers-reduced-motion:reduce){.anim{display:none}}
</style>
    <g id="kpub"><circle r="9" fill="none" stroke="#3fb950" stroke-width="2.5"/><path d="M9,0 H34 M27,0 V8 M33,0 V6" fill="none" stroke="#3fb950" stroke-width="2.5"/></g>
    <g id="kpriv"><circle r="9" fill="#d29922"/><circle r="3" fill="#0d1117"/><path d="M9,0 H34 M27,0 V9 M33,0 V7" fill="none" stroke="#d29922" stroke-width="3"/></g>
    <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2" fill="#8b949e"/><path d="M-4,-2 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#8b949e" stroke-width="2"/></g>
    <g id="env"><rect x="-22" y="-14" width="44" height="28" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><path d="M-22,-14 L0,3 L22,-14" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="lnk"><rect x="-14" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/><rect x="-2" y="-5" width="16" height="10" rx="5" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g id="fil"><path d="M-8,-11 H3 L8,-6 V11 H-8 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/><path d="M3,-11 V-6 H8" fill="none" stroke="#3fb950" stroke-width="1.8"/></g>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="960" height="600" rx="18"/>
<rect class="card" x="14" y="14" width="932" height="572" rx="14"/>
<rect x="30" y="30" width="96" height="30" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/><text x="78" y="49" text-anchor="middle" class="sub">Your logo</text>
<text x="144" y="52" class="h">What went wrong: a two-day gap</text>
<text x="30" y="84" class="s">the pipeline stopped, nobody noticed, and latest-only loading hid the gap</text>
<text x="30" y="157" class="col">WALMART</text><text x="30" y="267" class="col">OUR PIPELINE</text><text x="30" y="377" class="col">BRONZE</text>
<path class="flow" d="M250,176 V240 M250,286 V350"/>
<rect x="175" y="130" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="175" y="240" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="175" y="350" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<path class="flow" d="M440,176 V240 M440,286 V350"/>
<rect x="365" y="130" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="365" y="240" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="365" y="350" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<path class="flow" d="M630,176 V240 M630,286 V350"/>
<rect x="555" y="130" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="555" y="240" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="555" y="350" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<path class="flow" d="M820,176 V240 M820,286 V350"/>
<rect x="745" y="130" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="745" y="240" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="745" y="350" width="150" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="30" y1="528" x2="930" y2="528" stroke="#1c2128"/>
<text x="30" y="552" class="note">Example scenario with made-up dates. One delivery per day is assumed for illustration.</text>
<g class="anim"><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0200;0.0230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="175" y="130" width="150" height="46" rx="9" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="250" y="157" text-anchor="middle" class="pt">4 Oct delivery</text><g transform="translate(190,153)"><use href="#fil"/></g></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0600;0.0630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="175" y="240" width="150" height="46" rx="9" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="250" y="267" text-anchor="middle" class="pt">ran as normal</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.1000;0.1030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="175" y="350" width="150" height="46" rx="9" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="250" y="377" text-anchor="middle" class="pt">4 Oct loaded</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0300;0.0330;0.0600;0.0630;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0300;0.0600;1" calcMode="linear" path="M250,176 V240"/></circle><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0700;0.0730;0.1000;0.1030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.0700;0.1000;1" calcMode="linear" path="M250,286 V350"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2700;0.2730;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="365" y="130" width="150" height="46" rx="9" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="440" y="157" text-anchor="middle" class="pt">5 Oct delivery</text><g transform="translate(380,153)"><use href="#fil"/></g></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2900;0.2930;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="365" y="240" width="150" height="46" rx="9" fill="#2d1315" stroke="#f85149" stroke-width="2"/><text x="440" y="267" text-anchor="middle" class="pt">pipeline stopped</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3100;0.3130;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="365" y="350" width="150" height="46" rx="9" fill="#2a2110" stroke="#d29922" stroke-width="2" stroke-dasharray="5 5"/><text x="440" y="377" text-anchor="middle" class="pt">5 Oct missing</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3400;0.3430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="555" y="130" width="150" height="46" rx="9" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="630" y="157" text-anchor="middle" class="pt">6 Oct delivery</text><g transform="translate(570,153)"><use href="#fil"/></g></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3600;0.3630;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="555" y="240" width="150" height="46" rx="9" fill="#2d1315" stroke="#f85149" stroke-width="2"/><text x="630" y="267" text-anchor="middle" class="pt">still stopped</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.3800;0.3830;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="555" y="350" width="150" height="46" rx="9" fill="#2a2110" stroke="#d29922" stroke-width="2" stroke-dasharray="5 5"/><text x="630" y="377" text-anchor="middle" class="pt">6 Oct missing</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2800;0.2830;0.5000;0.5030;1" values="0;0;1;1;0;0"/><text x="30" y="318" class="note">No failure alert fired. Nobody noticed for two days.</text></g><text x="30" y="482" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2480;0.2510;1" values="0;0;1;1;0;0"/>Day 4 Oct: healthy</text><text x="30" y="502" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.0020;0.0050;0.2480;0.2510;1" values="0;0;1;1;0;0"/>Walmart publishes a delivery, the daily job loads it, and Bronze is up to date.</text><text x="30" y="482" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2520;0.2550;0.4980;0.5010;1" values="0;0;1;1;0;0"/>5 and 6 Oct: the pipeline stops</text><text x="30" y="502" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.2520;0.2550;0.4980;0.5010;1" values="0;0;1;1;0;0"/>Walmart keeps publishing, but nothing is collected. Nothing is loaded into Bronze and nobody is alerted.</text><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5200;0.5230;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="745" y="130" width="150" height="46" rx="9" fill="#0d2238" stroke="#58a6ff" stroke-width="2"/><text x="820" y="157" text-anchor="middle" class="pt">7 Oct delivery</text><g transform="translate(760,153)"><use href="#fil"/></g></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5400;0.5430;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="745" y="240" width="150" height="46" rx="9" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="820" y="261" text-anchor="middle" class="pt">restarted</text><text x="820" y="276" text-anchor="middle" class="sub" style="fill:#c9d1d9;font-size:10px">latest only</text></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5800;0.5830;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="745" y="350" width="150" height="46" rx="9" fill="#0f2a1a" stroke="#3fb950" stroke-width="2"/><text x="820" y="377" text-anchor="middle" class="pt">7 Oct loaded</text></g><circle r="5" fill="#58a6ff" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5300;0.5330;0.5600;0.5630;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5300;0.5600;1" calcMode="linear" path="M820,176 V240"/></circle><circle r="5" fill="#3fb950" filter="url(#glow)" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5700;0.5730;0.6000;0.6030;1" values="0;0;1;1;0;0"/><animateMotion dur="40s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5700;0.6000;1" calcMode="linear" path="M820,286 V350"/></circle><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5400;0.5430;0.7500;0.7530;1" values="0;0;1;1;0;0"/><text x="30" y="318" class="note">Get Latest Data returns only the latest delivery, not what was missed.</text></g><text x="30" y="482" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>7 Oct: the pipeline restarts</text><text x="30" y="502" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.5020;0.5050;0.7480;0.7510;1" values="0;0;1;1;0;0"/>It loads only the latest delivery. The deliveries from 5 and 6 October were never collected, so Bronze now has a gap.</text><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7700;0.7730;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="361" y="344" width="158" height="58" rx="10" fill="none" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="551" y="344" width="158" height="58" rx="10" fill="none" stroke="#f85149" stroke-width="2.5" stroke-dasharray="6 4"/></g><g opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.8000;0.8030;0.9950;0.9980;1" values="0;0;1;1;0;0"/><rect x="175" y="418" width="720" height="40" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/><text x="535" y="443" text-anchor="middle" class="pt">Maximum date in Bronze is 7 Oct, so everything looks fine. The gap is hidden.</text></g><text x="30" y="482" class="pt" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7520;0.7550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>The trap: a latest-only pipeline hides its own gaps</text><text x="30" y="502" class="body" opacity="0"><animate attributeName="opacity" dur="40s" repeatCount="indefinite" keyTimes="0;0.7520;0.7550;0.9980;1.0010;1" values="0;0;1;1;0;0"/>Taking the maximum date from Bronze would say the data is up to date, while 5 and 6 October are still missing.</text></g>
</svg>